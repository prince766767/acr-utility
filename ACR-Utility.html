<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Offline utility for preparing the Himachal Pradesh / UGC PBAS Annual Performance Based Appraisal (ACR), Parts I and II.">

<style>/* ===== Personal ACR Utility v1.0 — offline, single file ===== */
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2430; --muted:#6b7382; --line:#dfe3e9;
  --accent:#1f4e79; --accent-soft:#eaf1f8; --ok:#1a7f4b; --warn:#b7791f; --danger:#b03a35;
  --radius:10px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
  --fs:15px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181e; --panel:#1c2128; --ink:#e7ebf0; --muted:#98a2b3; --line:#2b323c;
    --accent:#7fb3e0; --accent-soft:#1e2a36; --shadow:0 1px 3px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:var(--fs); color:var(--ink); background:var(--bg); line-height:1.45;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:var(--panel); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; padding:8px 12px; flex-wrap:wrap;
  box-shadow:var(--shadow);
}
.brand{font-weight:700; letter-spacing:.2px; color:var(--accent); white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0}
.topbar .grow{flex:1}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.dirty{color:var(--warn)}
.status.saved{color:var(--ok)}

.btn{
  border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:7px 12px;
  cursor:pointer; white-space:nowrap; transition:.12s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:6px}
.btn.danger{color:var(--danger);border-color:transparent}
.btn.danger:hover{border-color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

select.session{
  border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;max-width:230px;
}

/* ---------- layout ---------- */
.wrap{display:flex; align-items:flex-start; gap:16px; max-width:1240px; margin:0 auto; padding:16px 12px 90px}
nav.side{
  position:sticky; top:64px; width:232px; flex:0 0 232px; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--radius); padding:8px; box-shadow:var(--shadow);
}
nav.side a{
  display:flex; justify-content:space-between; gap:8px; align-items:center;
  padding:8px 10px; border-radius:7px; text-decoration:none; color:var(--ink); font-size:14px; cursor:pointer;
}
nav.side a:hover{background:var(--accent-soft)}
nav.side a.active{background:var(--accent); color:#fff; font-weight:600}
nav.side a .pill{font-size:11px;color:var(--muted);background:var(--bg);border-radius:20px;padding:1px 7px}
nav.side a.active .pill{background:rgba(255,255,255,.25);color:#fff}
nav.side hr{border:0;border-top:1px solid var(--line);margin:8px 4px}
nav.side .navhead{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:6px 10px 2px}

main{flex:1; min-width:0}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px; margin-bottom:16px; box-shadow:var(--shadow);
}
.card > h2{margin:0 0 4px; font-size:19px; color:var(--accent)}
.card > .sub{margin:0 0 16px; color:var(--muted); font-size:13px}
h3.grp{
  margin:22px 0 10px; font-size:15px; padding-bottom:6px; border-bottom:2px solid var(--accent-soft);
}
h4.sgrp{margin:16px 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.hint{color:var(--muted); font-size:12.5px; margin:4px 0 0}
.notice{
  background:var(--accent-soft); border-left:3px solid var(--accent); padding:10px 12px;
  border-radius:6px; font-size:13px; margin:10px 0;
}

/* ---------- fields ---------- */
.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.grid.one{grid-template-columns:1fr}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media screen and (max-width:860px){ .grid,.grid.three{grid-template-columns:1fr} }
label.f{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted)}
label.f > span.lb{font-weight:600;color:var(--ink);font-size:13px}
label.f input,label.f select,label.f textarea{
  border:1px solid var(--line); border-radius:8px; padding:9px 10px; background:var(--bg); width:100%;
}
label.f input:focus,label.f textarea:focus,label.f select:focus{
  outline:2px solid var(--accent); outline-offset:-1px; background:var(--panel);
}
label.f textarea{min-height:92px; resize:vertical; line-height:1.5}
label.f.wide{grid-column:1/-1}

/* ---------- repeatable tables ---------- */
.tblwrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px; margin-top:8px}
table.rt{border-collapse:collapse; width:100%; min-width:600px; font-size:13px}
table.rt th{
  background:var(--accent-soft); text-align:left; padding:8px; font-weight:600; font-size:12px;
  border-bottom:1px solid var(--line); vertical-align:bottom; white-space:normal;
}
table.rt td{border-bottom:1px solid var(--line); padding:4px; vertical-align:top}
table.rt tr:last-child td{border-bottom:0}
table.rt td textarea,table.rt td input,table.rt td select{
  width:100%; border:1px solid transparent; background:transparent; border-radius:6px; padding:6px;
  min-width:80px;
}
table.rt td textarea{min-height:38px;resize:vertical;line-height:1.4}
table.rt td input:focus,table.rt td textarea:focus,table.rt td select:focus{
  background:var(--panel); border-color:var(--accent); outline:none;
}
table.rt td.num input{text-align:right}
td.rowno{color:var(--muted);text-align:center;font-size:12px;padding-top:12px;width:34px}
td.act{width:38px;text-align:center}
.addrow{margin-top:8px}
.emptyrow{color:var(--muted);font-style:italic;padding:14px;text-align:center}

/* ---------- score widgets ---------- */
.scorebar{
  display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; padding:12px; border-radius:8px;
  background:var(--accent-soft);
}
.scorebar .s{flex:1 1 130px; min-width:120px}
.scorebar .s b{display:block; font-size:20px; line-height:1.2}
.scorebar .s span{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px}
.scorebar .s.warnv b{color:var(--warn)}
.scorebar .s.okv b{color:var(--ok)}
.cap{font-size:12px;color:var(--muted);margin-top:6px}
.capover{color:var(--danger);font-weight:600}

/* ---------- enclosure chips ---------- */
.encl li{margin-bottom:6px}
.encl .row{display:flex;gap:8px;align-items:flex-start}
.encl textarea{flex:1;min-height:52px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);width:100%}
.encref{font-size:12px;color:var(--muted)}

/* ---------- preview ---------- */
#previewOverlay{
  position:fixed; inset:0; background:rgba(15,20,28,.6); z-index:60; display:none;
  overflow:auto; padding:0;
}
#previewOverlay.on{display:block}
.pvbar{
  position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--line);
  display:flex; gap:8px; align-items:center; padding:8px 12px; z-index:5; flex-wrap:wrap;
}
.pvbody{padding:18px 8px 60px; display:flex; flex-direction:column; align-items:center; gap:14px}

/* ===== the document itself ===== */
.doc{
  background:#fff; color:#000; width:210mm; min-height:297mm; padding:16mm 15mm 20mm;
  font-family:"Times New Roman",Times,Georgia,serif; font-size:11pt; line-height:1.38;
  box-shadow:0 4px 18px rgba(0,0,0,.28); position:relative;
  page-break-after:always; break-after:page; display:block;
}
.doc.lastdoc{page-break-after:auto; break-after:auto}
.doc .pg{page-break-after:always; break-after:page}
.doc .pg:last-child{page-break-after:auto; break-after:auto}
.doc h1.t1{font-size:15pt; text-align:center; margin:0 0 2pt; letter-spacing:.4px}
.doc h2.t2{font-size:13pt; text-align:center; margin:0 0 3pt}
.doc .center{text-align:center}
.doc .appx{text-align:right; font-size:10pt; font-style:italic; margin:0 0 6pt}
.doc .banner{
  border:1.2pt solid #000; padding:7pt 8pt; margin:0 0 10pt; text-align:center;
}
.doc .parthead{
  background:#e8eef4; border:1pt solid #000; text-align:center; font-weight:bold;
  padding:5pt; margin:12pt 0 8pt; font-size:12pt; letter-spacing:.5px;
}
.doc .sechead{
  border-bottom:1.5pt solid #000; font-weight:bold; margin:12pt 0 6pt; padding-bottom:2pt; font-size:11.5pt;
}
.doc .qn{margin:8pt 0 3pt; font-weight:bold}
.doc .ans{margin:0 0 8pt; white-space:pre-wrap; min-height:14pt; padding-left:6pt; border-left:2pt solid #c9d3dd}
.doc .ans.blank{min-height:44pt; border-left-style:dotted}
.doc dl.kv{margin:0; display:grid; grid-template-columns:auto 1fr; gap:2pt 8pt}
.doc dl.kv dt{white-space:nowrap}
.doc dl.kv dd{margin:0; border-bottom:.6pt dotted #444; min-height:13pt}
.doc dl.kv dd.plain{border-bottom:0}
.doc table.f{border-collapse:collapse; width:100%; margin:6pt 0 10pt; font-size:9.5pt}
.doc table.f th,.doc table.f td{border:.7pt solid #000; padding:3pt 4pt; vertical-align:top; text-align:left}
.doc table.f th{background:#e8eef4; font-weight:bold; text-align:center}
.doc table.f td.c{text-align:center}
.doc table.f td.r{text-align:right}
.doc table.f tr.tot td{background:#f2f4f7; font-weight:bold}
.doc table.f td.blankcell{height:20pt}
.doc .sig{display:flex; justify-content:space-between; gap:20pt; margin-top:16pt; font-size:10.5pt}
.doc .sig .b{white-space:pre-line}
.doc .sig .b.r{text-align:left}
.doc .foot{
  position:absolute; bottom:8mm; left:15mm; right:15mm; border-top:.5pt solid #999;
  padding-top:3pt; font-size:8pt; color:#555; display:flex; justify-content:space-between;
}
.doc .rule{border:0;border-top:.7pt solid #000;margin:10pt 0}
.doc ol.enc{margin:4pt 0 0 16pt; padding:0}
.doc ol.enc li{margin-bottom:3pt}
.doc .choices{margin:2pt 0 8pt 14pt}
.doc .choices div{margin-bottom:1pt}
.doc .dotline{border-bottom:.6pt dotted #333; min-height:13pt; margin:2pt 0}
.doc .note{font-size:9.5pt; font-style:italic; margin:4pt 0}
.doc .fillbox{border:.7pt solid #000; min-height:60pt; margin:4pt 0 10pt}
.doc .fillbox.tall{min-height:110pt}
.doc .fillbox.short{min-height:36pt}
#printfoot{display:none}

/* answers: whatever the teacher entered, tinted so it reads apart from the form */
.doc .av,.doc .av *{color:var(--ans,#1a3a8f); font-weight:var(--answ,inherit)}
.doc td.av,.doc dd.av{color:var(--ans,#1a3a8f)}
.doc .ans.av{border-left-color:var(--ans,#1a3a8f); opacity:1}

/* point 10 — a compact eight-box strip on one line, not a full-width table */
.doc .dobrow{display:flex; align-items:flex-end; gap:10pt; flex-wrap:wrap; margin:6pt 0 8pt}
.doc .dobrow .dlab{font-weight:bold; white-space:nowrap}
.doc table.dobbox{border-collapse:collapse; width:auto; margin:0; table-layout:fixed}
.doc table.dobbox th{
  border:0; background:none; padding:0 0 1pt; width:22pt; text-align:center;
  font-weight:normal; font-size:9.5pt;
}
.doc table.dobbox td{
  border:.7pt solid #000; width:22pt; height:15pt; text-align:center; padding:1pt 0; font-size:11pt;
}
.doc .dobrow .dwords{white-space:normal; flex:1 1 auto; min-width:120pt}
@media screen and (max-width:820px){
  .doc .dobrow{gap:6pt}
  .doc table.dobbox th,.doc table.dobbox td{width:18pt}
}

/* ---------- printing ---------- */
@page{ size:A4; margin:14mm 14mm 14mm 14mm; }
@media screen and (max-width:820px){
  /* on a phone the sheet is read, not printed — let it reflow instead of
     forcing a 210 mm canvas the user has to pan sideways */
  .doc{width:100%; padding:10mm 6mm; font-size:10.5pt; box-shadow:none; min-height:0}
  .doc dl.kv{grid-template-columns:1fr; gap:0 0}
  .doc dl.kv dt{white-space:normal; font-weight:bold; margin-top:5pt}
  .doc dl.kv dd{margin-bottom:3pt}
  .doc .tblscroll{overflow-x:auto}
  .pvbody{padding:10px 0 60px}
  .pvbar .status{display:none}
}

@media print{
  body{background:#fff}
  .topbar,.wrap,.pvbar,.fabbar,#toast{display:none !important}
  #previewOverlay{position:static;display:block;background:#fff;overflow:visible;padding:0}
  #previewOverlay:not(.on){display:none !important}
  .pvbody{padding:0;display:block}
  .doc{
    width:auto;min-height:0;box-shadow:none;padding:0 0 4pt;
    font-size:10pt;line-height:1.28;orphans:3;widows:3;page-break-after:always;
  }
  .doc.lastdoc{page-break-after:auto}
  .doc .foot{display:none}
  #printfoot{
    display:flex !important; justify-content:space-between; position:fixed; bottom:0; left:0; right:0;
    font-family:"Times New Roman",Times,serif; font-size:8pt; color:#555;
    border-top:.5pt solid #aaa; padding-top:2pt;
  }
  .doc .banner{padding:5pt 6pt;margin-bottom:7pt}
  .doc .parthead{margin:8pt 0 6pt;padding:4pt}
  .doc dl.kv{gap:1pt 8pt}
  .doc table.f{margin:4pt 0 7pt;font-size:9pt}
  .doc table.f th,.doc table.f td{padding:2pt 3pt}
  .doc .qn{margin:6pt 0 2pt}
  .doc .ans{margin-bottom:6pt}
  .doc .ans.blank{min-height:34pt}
  .doc .sig{margin-top:12pt}
  .doc table.f{page-break-inside:auto}
  .doc table.f tr{page-break-inside:avoid}
  .doc thead{display:table-header-group}
  .doc .qn,.doc .parthead,.doc .sechead{page-break-after:avoid}
  .doc .sig,.doc .fillbox,.doc .choices,.doc .banner{page-break-inside:avoid}
}

/* ---------- misc ---------- */
#toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
  background:#1d2430; color:#fff; padding:10px 16px; border-radius:8px; font-size:14px;
  opacity:0; pointer-events:none; transition:.22s; z-index:99; max-width:92vw; text-align:center;
}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.fabbar{
  position:fixed; right:16px; bottom:16px; display:flex; gap:8px; z-index:35;
}
@media screen and (min-width:861px){ .fabbar{display:none} }
.fabbar .btn{box-shadow:0 4px 14px rgba(0,0,0,.2)}
.mobnav{display:none}
@media screen and (max-width:860px){
  nav.side{display:none}
  .mobnav{display:block; width:100%; margin-bottom:12px}
  .mobnav select{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
  .wrap{flex-direction:column; align-items:stretch; padding:12px 10px 92px; max-width:100%}
  main{width:100%; min-width:0}
  .card{padding:14px; width:100%; min-width:0}
  .card > h2{font-size:17px}
  /* the floating bar already offers Word / PDF, so keep the header to one line */
  .topbar #btnDocx,.topbar #btnPdf,.topbar #btnSave,.topbar #btnPreview{display:none}
  .stepnav{margin-bottom:4px}
  .topbar{gap:8px; padding:8px 10px}
  .brand{font-size:14px}
  select.session{max-width:150px; flex:1}
  .tblwrap{max-width:100%}
  .scorebar .s{flex:1 1 45%}
}
@media screen and (max-width:420px){
  .brand small{display:none}
}
/* ---------- previous / next ---------- */
.stepnav{
  display:flex; align-items:stretch; justify-content:space-between; gap:12px; margin:4px 0 8px;
}
.stepbtn{
  display:flex; align-items:center; gap:10px; text-align:left; padding:10px 14px; max-width:46%;
}
.stepbtn .ar{font-size:18px; line-height:1; color:var(--accent); flex:0 0 auto}
.stepbtn .lbl{display:flex; flex-direction:column; min-width:0}
.stepbtn .lbl small{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); line-height:1.4;
}
.stepbtn:last-child .lbl{text-align:right}
.stepcount{
  align-self:center; font-size:12px; color:var(--muted); white-space:nowrap; flex:0 0 auto;
}
@media screen and (max-width:520px){
  .stepbtn{padding:9px 11px; max-width:44%}
  .stepbtn .lbl{font-size:13px}
  .stepcount{display:none}
}

.rowtools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px}
.yearlist{display:grid;gap:8px}
.yearrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px}
.yearrow .yl{flex:1;min-width:0}
.yearrow .yl b{display:block}
.yearrow .yl span{font-size:12px;color:var(--muted)}
.yearrow.cur{border-color:var(--accent);background:var(--accent-soft)}

/* ---------- answer-colour picker ---------- */
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.swatch{
  display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
  border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;
}
.swatch i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.swatch:hover{border-color:var(--accent)}
.swatch.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
label.f input[type=color]{height:42px;padding:4px;cursor:pointer}
.samplerow{
  margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;
  font-family:"Times New Roman",Times,serif;font-size:12pt;color:#000;display:flex;gap:14px;align-items:baseline;
}
.samplerow .av{color:var(--ans);font-weight:var(--answ)}
.appfooter{padding:10px 16px;text-align:center;font-size:12px;color:#6b7785;border-top:1px solid #e3e8ef}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">ACR Utility<small>PBAS · UGC Regulations 2010</small></div>
  <select class="session" id="sessionSel" title="Switch year"></select>
  <span class="status" id="saveStatus">Ready</span>
  <button class="btn ghost status" id="syncStatus" style="display:none"></button>
  <button class="btn ghost sm status" id="authArea"></button>
  <span class="grow"></span>
  <button class="btn" id="btnSave" title="Save now (Ctrl+S)">Save</button>
  <button class="btn" id="btnPreview">Preview</button>
  <button class="btn" id="btnDocx">Word (.docx)</button>
  <button class="btn primary" id="btnPdf">PDF</button>
</header>

<div class="wrap">
  <nav class="side" id="nav"></nav>
  <div class="mobnav"><select id="mobsel" aria-label="Go to section"></select></div>
  <main id="main"></main>
</div>

<div class="fabbar">
  <button class="btn" id="btnPreview2">Preview</button>
  <button class="btn" id="btnDocx2">Word</button>
  <button class="btn primary" id="btnPdf2">PDF</button>
</div>

<div id="previewOverlay">
  <div class="pvbar">
    <button class="btn" id="btnClosePv">← Back to form</button>
    <span class="grow" style="flex:1"></span>
    <span class="status">Print · choose A4, margins “Default”, turn off browser headers &amp; footers</span>
    <button class="btn" id="btnDocx2b" onclick="downloadDocx()">Word (.docx)</button>
    <button class="btn primary" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div class="pvbody" id="pvContent"></div>
</div>

<div id="toast"></div>

<footer class="appfooter">Utility developed by: Dr. Prince Thakur (Assistant Professor Botany)</footer>

<script>
/* ===== model.js ===== */
/* ===================== DATA MODEL ===================== */
const SCHEMA_VERSION = 5;
const uid = () => 'acr-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
const nowISO = () => new Date().toISOString();

function blankDoc(session) {
  return {
    schemaVersion: SCHEMA_VERSION,
    id: uid(),
    createdAt: nowISO(),
    updatedAt: nowISO(),
    touched: false,          // set once the user actually edits; pristine copies lose a merge
    rev: 0,                  // monotonic per-document edit counter, used by drivesync.js conflict detection
    session: session || '',
    stream: 'science',                       // science | arts  (decides project/consultancy slabs)
    style: { answerColor: '#1a3a8f', answerBold: false },   // how filled-in answers are printed
    college: { name: '', district: '', pin: '', principal: '', place: '' },
    p1: {
      fullName: '', fatherHusband: '', empCode: '', subject: '', dateAppointment: '',
      designation: '', payBand: '', promotion: '', qualAcademic: '', qualDivision: '',
      qualProfessional: '', qualResearch: '', dob: '', dobWords: '', status: '',
      served: [], deptExamRoll: '', deptExamSession: '', hindi: '', otherAssignment: '',
      permAddress: '', landline: '', mobile: '', email: ''
    },
    s1: {
      q17: '', q18: '',
      q19a: [], q19aTotal: '', q19aNote: '', q19b: '',
      q19c: [], q19d: [], q19f: [], q19g: '',
      q20: [],
      q21i: '', q21ii: [],
      q22: '', q22rows: [],
      q23: '', q24: '', q24b: '', q25: ''
    },
    s2: {
      c1: {
        rows: [], scoreA: '', scoreB: '',
        ii: { rows: [], note: '', score: '' },
        iii: { rows: [] },
        iv: { rows: [] }
      },
      c2: { i: [], ii: [], iii: [] },
      c3: { A: [], Bi: [], Bii: [], Biii: [], Ci: [], Cii: [], Ciii: [], Civ: [], D: [], Ei: [], Eii: [], Eiii: [] },
      lastYear: { c1: '', c2: '', c3: '' },
      override: { c1: '', c2: '', c3: '' }
    },
    partB: [],
    enclosures: [],
    certify: { place: '', date: '', designation: '' },
    principalBlock: { name: '', college: '', place: '' }
  };
}

/* Fields carried forward when cloning a year (stable identity data). */
function cloneForNewYear(src, session) {
  const d = blankDoc(session);
  d.stream = src.stream;
  d.style = JSON.parse(JSON.stringify(src.style || d.style));
  d.college = JSON.parse(JSON.stringify(src.college));
  d.p1 = JSON.parse(JSON.stringify(src.p1));
  d.certify = { place: src.certify.place || '', date: '', designation: src.certify.designation || '' };
  d.principalBlock = JSON.parse(JSON.stringify(src.principalBlock));
  // carry last year's totals into the "Last Academic Year" column of the summary
  const t = totals(src);
  d.s2.lastYear = { c1: fmt(t.c1.total), c2: fmt(t.c2.total), c3: fmt(t.c3.total) };
  return d;
}

/* A personal seed document used to live here (a real, filled-in 2024-25 ACR used as the
   default starting point for a single-teacher deployment). It has been removed from this
   shared source file so the public, distributable build never ships anyone's real ACR
   content or personal data. A brand-new install now always starts from blankDoc() — see
   boot() in app.js. The developer's own starting data lives only in the gitignored
   tools/personal-seed.acrbak.json and can be restored, if wanted, with the existing
   Import a backup button; no code path in this file depends on it. */

/* ===================== SCORING ===================== */
const num = (v) => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const fmt = (n) => (Math.round(n * 100) / 100).toString();
const cap = (n, m) => Math.min(n, m);
const sumRows = (rows, key) => (rows || []).reduce((a, r) => a + num(r[key]), 0);

/* joint-authorship allocation per UGC 2010 Table-I note */
function share(base, row) {
  const authors = Math.max(1, num(row.authors) || 1);
  if (authors <= 1) return base;
  return row.main === 'yes' ? base * 0.6 : (base * 0.4) / (authors - 1);
}

const C3RULES = {
  A: (r) => share(r.kind === 'refereed' ? 15 : 10, r),
  Bi: (r) => share(r.kind === 'international' ? 10 : 5, r),
  Bii: (r) => share(10, r),
  Biii: (r) => {
    const base = { intl_sole: 50, intl_chapter: 10, natl_sole: 25, natl_chapter: 5, local_sole: 15, local_chapter: 3 }[r.kind] || 0;
    return share(base, r);
  },
  Ci: (r, stream) => {
    const a = num(r.amount);
    if (stream === 'arts') return a > 5 ? 20 : a > 3 ? 15 : a >= 0.25 ? 10 : 0;
    return a > 30 ? 20 : a > 5 ? 15 : a >= 0.5 ? 10 : 0;
  },
  Cii: (r, stream) => {
    const per = stream === 'arts' ? 2 : 10;
    return Math.floor(num(r.amount) / per) * 10;
  },
  Ciii: (r) => (r.kind === 'major' ? 20 : 10),
  Civ: (r) => (r.kind === 'international' ? 50 : 30),
  D: (r) => ({ mphil_awarded: 3, phd_awarded: 10, phd_submitted: 7 }[r.kind] || 0) * Math.max(1, num(r.count) || 1),
  Ei: (r) => (r.weeks === 'two' ? 20 : 10),
  Eii: (r) => ({ international: 10, national: 7.5, state: 5, local: 3 }[r.level] || 0),
  Eiii: (r) => (r.level === 'international' ? 10 : 5)
};

function suggested(block, row, stream) {
  const f = C3RULES[block];
  return f ? Math.round(f(row, stream) * 100) / 100 : 0;
}

function totals(d) {
  const c1 = d.s2.c1;
  // (i)(a) proportionate rule: no score below 80% of assigned classes
  const pcts = (c1.rows || []).map((r) => num(r.pct)).filter((n) => n > 0);
  const avg = pcts.length ? pcts.reduce((a, b) => a + b, 0) / pcts.length : 0;
  const autoA = avg >= 100 ? 50 : avg >= 80 ? Math.round(50 * (avg / 100) * 100) / 100 : 0;
  const a = c1.scoreA === '' ? autoA : cap(num(c1.scoreA), 50);
  const b = cap(num(c1.scoreB), 10);
  const ii = cap(num(c1.ii.score), 20);
  const iiiRaw = sumRows(c1.iii.rows, 'score'), iii = cap(iiiRaw, 20);
  const ivRaw = sumRows(c1.iv.rows, 'score'), iv = cap(ivRaw, 25);
  const c1total = cap(a + b + ii + iii + iv, 125);

  const c2 = d.s2.c2;
  const p1Raw = sumRows(c2.i, 'score'), p1 = cap(p1Raw, 20);
  const p2Raw = sumRows(c2.ii, 'score'), p2 = cap(p2Raw, 15);
  const p3Raw = sumRows(c2.iii, 'score'), p3 = cap(p3Raw, 15);
  const c2total = cap(p1 + p2 + p3, 25);

  const c3 = d.s2.c3;
  const bs = {};
  Object.keys(c3).forEach((k) => { bs[k] = sumRows(c3[k], 'score'); });
  const training = cap(bs.Ei, 30);                       // E(i) capped at 30
  const c3total = bs.A + bs.Bi + bs.Bii + bs.Biii + bs.Ci + bs.Cii + bs.Ciii + bs.Civ + bs.D + training + bs.Eii + bs.Eiii;

  const ov = d.s2.override || {};
  const fin = (k, v) => (ov[k] !== undefined && ov[k] !== '' ? num(ov[k]) : v);

  return {
    c1: { a, autoA, avg, b, ii, iii, iiiRaw, iv, ivRaw, total: c1total, final: fin('c1', c1total) },
    c2: { i: p1, iRaw: p1Raw, ii: p2, iiRaw: p2Raw, iii: p3, iiiRaw: p3Raw, raw: p1 + p2 + p3, total: c2total, final: fin('c2', c2total) },
    c3: { blocks: bs, training, total: c3total, final: fin('c3', c3total) }
  };
}


/* ===== docmodel.js ===== */
/* ===================== DOCUMENT MODEL =====================
   buildDoc(d) -> flat array of blocks.
   Consumed by renderHTML() (preview + print/PDF) and buildDocx() (Word).
   Part-I and Part-II carry the teacher's data.
   Part-III and Part-IV are reproduced blank, word-for-word, in the official
   order and layout, but cleanly typeset.
=========================================================== */

const B = {
  pb: () => ({ t: 'pb' }),
  p: (text, o) => ({ t: 'p', text: text ?? '', o: o || {} }),
  note: (text) => ({ t: 'p', text, o: { italic: true, size: 9.5 } }),
  parthead: (text, sub) => ({ t: 'parthead', text, sub }),
  sechead: (text) => ({ t: 'sechead', text }),
  q: (n, text) => ({ t: 'q', n, text }),
  ans: (text, opt) => ({ t: 'ans', text: text ?? '', ...(opt || {}) }),
  kv: (rows) => ({ t: 'kv', rows }),
  table: (cols, head, rows, o) => ({ t: 'table', cols, head: head || [], rows: rows || [], o: o || {} }),
  ol: (items, start) => ({ t: 'ol', items, start: start || 1 }),
  sig: (left, right) => ({ t: 'sig', left, right }),
  /* point 10: a compact eight-box strip, not a full-width table */
  dob: (label, digits, words) => ({ t: 'dob', label, digits, words }),
  rule: () => ({ t: 'rule' }),
  box: (h) => ({ t: 'box', h: h || 'med' }),
  choices: (items) => ({ t: 'choices', items }),
  sp: (h) => ({ t: 'sp', h: h || 6 })
};

const dash = (v, fill) => (String(v ?? '').trim() === '' ? (fill || '') : String(v));
const DOT = '…………………………………………………';

function dobCells(dob) {
  const s = String(dob || '').replace(/\D/g, '').padEnd(8, ' ').slice(0, 8);
  return s.split('').map((c) => c.trim());
}

function buildDoc(d) {
  const t = totals(d);
  const o = [];
  const P = d.p1, S = d.s1, C = d.s2;
  const encl = d.enclosures || [];
  const eref = (n) => {
    const s = String(n || '').trim();
    return s ? 'Encl. ' + s : '';
  };

  /* ---------------- COVER + PART I ---------------- */
  o.push(B.p('Appendix-IV', { align: 'r', italic: true, size: 10 }));
  o.push({
    t: 'banner',
    lines: [
      { text: 'HIMACHAL PRADESH GOVERNMENT', bold: true, size: 13 },
      { text: 'EDUCATION DEPARTMENT', bold: true, size: 12 },
      { text: '', size: 6 },
      { text: 'ANNUAL PERFORMANCE BASED APPRAISAL', bold: true, size: 14 },
      { text: '(with API scores based on PBAS as per UGC Regulations 2010)', size: 10.5 },
      { text: '(FOR ASSISTANT PROFESSORS / ASSOCIATE PROFESSORS IN COLLEGE CADRE)', size: 10.5, italic: true }
    ]
  });
  o.push(B.kv([
    ['Name of the College through which ACR is submitted',
      [d.college.name, [d.college.district, d.college.pin].filter(Boolean).join(' ')].filter(Boolean).join(', ')],
    ['Appraisal of work and conduct of Dr./Shri/Smt/Kumari', P.fullName],
    ['Submitted for the year / session', d.session]
  ]));
  o.push(B.parthead('PART-I  ·  PERSONAL DATA', '(To be filled up by the Assistant Professor / Associate Professor)'));
  o.push(B.kv([
    ['1.  Full Name (in capital letters)', P.fullName],
    ['2.  Father / Husband name', P.fatherHusband],
    ['3.  Employee Code', P.empCode],
    ['4.  Subject for which appointed', P.subject],
    ['5.  Date of appointment (in College Cadre)', P.dateAppointment],
    ['6.  Current Designation', P.designation],
    ['7.  Present Pay Band with Grade Pay', P.payBand],
    ['8.  Date of promotion (if any, during past one year)', P.promotion],
    ['9.  Qualification — (a) Academic / Division', [P.qualAcademic, P.qualDivision].filter(Boolean).join('  —  ')],
    ['      (b) Professional', P.qualProfessional],
    ['      (c) Research Degree', P.qualResearch]
  ]));
  o.push(B.dob('10.  Date of Birth', dobCells(P.dob), P.dobWords));
  o.push(B.kv([
    ['11.  Permanent / Quasi-permanent / Temporary / Contract', P.status]
  ]));
  o.push(B.p('12.  College / Colleges in which served during the year, with specific duration', { bold: true }));
  o.push(B.table([8, 57, 35], [[{ text: 'Sr.', align: 'c' }, 'College', 'Duration']],
    (P.served && P.served.length ? P.served : [{ name: '', duration: '' }])
      .map((r, i) => [{ text: String(i + 1), align: 'c' }, r.name, r.duration]), { ansBody: true }));
  o.push(B.kv([
    ['13. (a)  Roll No. (with session) & date of passing of Departmental Exam.',
      [P.deptExamRoll, P.deptExamSession].filter(Boolean).join('   ·   ')],
    ['      (b)  Hindi subject: cleared / exempted (mention details)', P.hindi],
    ['14.  Any other major assignment in addition to teaching (e.g. Offg. Principal, etc.)', P.otherAssignment],
    ['15.  Permanent Address (with PIN code)', P.permAddress],
    ['16.  Landline telephone No.', P.landline],
    ['        Mobile No.', P.mobile],
    ['        Email', P.email]
  ]));
  o.push(B.pb());

  /* ---------------- PART II SECTION I ---------------- */
  o.push(B.parthead('PART-II  :  SECTION-I', '( SELF APPRAISAL )'));
  o.push(B.note('Brief resume should bring out any significant achievement during the period under report.'));
  o.push(B.q(17, 'What do you think has been your most important contribution this year?'));
  o.push(B.ans(S.q17));
  o.push(B.q(18, 'Have you made any contribution in the area of work not assigned to you?'));
  o.push(B.ans(S.q18));

  o.push(B.q('19 (a)', 'Weekly time table (whole academic year)'));
  o.push(B.table([5, 27, 16, 15, 17, 20],
    [[{ text: 'Sr.', align: 'c' }, 'Class', 'Name of the College',
      'No. of lectures allocated (per week)', 'Total lectures actually delivered during session',
      '% age of syllabus completed for each class / course']],
    (S.q19a || []).map((r, i) => [{ text: String(i + 1), align: 'c' }, r.cls, r.college,
      { text: r.allocated, align: 'c' }, { text: r.delivered, align: 'c' }, { text: r.syllabus, align: 'c' }])
      .concat([[{ text: 'Total periods per week', span: 3, bold: true },
      { text: dash(S.q19aTotal), align: 'c', bold: true },
      { text: dash(S.q19aNote), span: 2, italic: true }]]),
    { totLast: true, ansBody: true }));
  o.push(B.q('19 (b)', 'Any special effort made to improve classroom instruction.'));
  o.push(B.ans(S.q19b));
  o.push(B.q('19 (c)', 'How many assignments and class tests did you give this year?'));
  o.push(B.table([5, 26, 15, 22, 32],
    [[{ text: 'Sr.', align: 'c' }, 'Class', 'No. of assignments given to students',
      'No. of class tests given to students', 'Refer the verifiable record available in the College Office']],
    (S.q19c || []).map((r, i) => [{ text: String(i + 1), align: 'c' }, r.cls,
      { text: r.assignments, align: 'c' }, r.tests, r.remark]), { ansBody: true }));
  o.push(B.q('19 (d)', 'Details of academic activities organised in the college.'));
  o.push(B.table([30, 70], [['Title of the activity', 'Brief detail of activity']],
    (S.q19d || []).map((r) => [r.title, r.detail]), { ansBody: true }));
  o.push(B.q('19 (f)', 'Which new books relating to your subject did you read during the year?'));
  o.push(B.note('A brief extract of about 50 words on the value content of each book is given below.'));
  (S.q19f || []).forEach((bk, i) => {
    o.push(B.p((i + 1) + '.  ' + dash(bk.title), { bold: true, ans: true }));
    o.push(B.kv([
      ['      Author / Editor', bk.author, true],
      ['      Publisher', [bk.publisher, bk.pages ? bk.pages + ' pages' : ''].filter(Boolean).join('  ·  '), true]
    ]));
    o.push(B.p('      Brief extract: ' + dash(bk.extract), { size: 10, ans: true }));
  });
  o.push(B.q('19 (g)', 'What are the vital problems of teaching before you, in order of importance?'));
  o.push(B.ans(S.q19g));

  o.push(B.q(20, 'Details of last year’s annual examination results'));
  o.push(B.table([13, 8, 7, 6, 7, 8, 7, 6, 6, 6, 6, 20],
    [[{ text: 'Class', rspan: 2 }, { text: 'Duration for which taught', rspan: 2 },
    { text: 'Total students appeared', rspan: 2 }, { text: 'Passed', rspan: 2 },
    { text: 'College pass %', rspan: 2 }, { text: 'University pass %', rspan: 2 },
    { text: 'Variation (+/–) (col. 5–6)', rspan: 2 }, { text: 'Details of pass students', span: 4 },
    { text: 'Reasons for low %age, if any', rspan: 2 }],
    [{ text: 'Div. I', align: 'c' }, { text: 'Div. II', align: 'c' },
    { text: 'Div. III', align: 'c' }, { text: 'Failed', align: 'c' }]],
    (S.q20 || []).map((r) => [r.cls, r.duration, { text: r.appeared, align: 'c' }, { text: r.passed, align: 'c' },
    { text: r.collegePct, align: 'c' }, { text: r.univPct, align: 'c' }, { text: r.variation, align: 'c' },
    { text: r.d1, align: 'c' }, { text: r.d2, align: 'c' }, { text: r.d3, align: 'c' },
    { text: r.failed, align: 'c' }, r.reason]),
    { tiny: true, ansBody: true }));

  o.push(B.q('21 (i)', 'Whether you acquired any degree or fresh academic / professional qualification during the year? If “YES”, mention the name of the degree, year of passing, institution etc.'));
  o.push(B.ans(S.q21i));
  o.push(B.q('21 (ii)', 'Academic Staff College Orientation / Refresher Course / Summer School attended during the year'));
  o.push(B.table([34, 22, 20, 24],
    [['Name of the Summer School / Refresher / Orientation Course with sponsoring agency',
      'Place of Summer School / ASC where the course was attended', 'Duration of school / course', 'RC / OC No. with title']],
    (S.q21ii || []).map((r) => [r.name, r.place, r.duration, r.rc]), { ansBody: true }));
  o.push(B.q(22, 'Are you doing any research work? If “YES”, provide the following details.'));
  if (String(S.q22 || '').trim()) o.push(B.ans(S.q22));
  o.push(B.table([34, 22, 20, 24],
    [['Topic / title of research project', 'Name of the University / Institution registered with',
      'Nature of project (Minor / Major / Doctoral / Post-Doctoral)', 'Present status of research work / project']],
    (S.q22rows || []).map((r) => [r.topic, r.univ, r.nature, r.status]), { ansBody: true }));
  o.push(B.q(23, 'Did you receive any honour, prize or award during the year? If “YES”, give details.'));
  o.push(B.ans(S.q23));
  o.push(B.q(24, 'Are you satisfied with your present position / pay? If not, do you want to change the profession? Give reasons.'));
  o.push(B.ans([S.q24, S.q24b].filter((x) => String(x || '').trim()).join('\n')));
  o.push(B.q(25, 'Any other significant point which is not covered above.'));
  o.push(B.ans(S.q25));
  o.push(B.pb());

  /* ---------------- PART II SECTION II ---------------- */
  o.push(B.parthead('PART-II  :  SECTION-II',
    'ANNUAL SELF-ASSESSMENT FOR THE PERFORMANCE BASED APPRAISAL SYSTEM (PBAS)'));
  o.push(B.kv([['For the session / year', d.session]]));
  o.push(B.note('(To be completed and submitted at the end of each academic year.)'));
  o.push(B.sechead('PART-A : ACADEMIC PERFORMANCE INDICATORS'));

  o.push(B.p('(i)  Lectures, seminars, tutorials, practicals, contact hours (give semester-wise details where necessary)', { bold: true }));
  o.push(B.table([5, 25, 12, 25, 11, 10, 12],

      'No. of classes per week allotted', 'No. of classes conducted', '% of classes / practicals taken as per documented record']],
    (C.c1.rows || []).map((r, i) => [{ text: String(i + 1), align: 'c' }, r.course, r.level, r.mode,
      { text: r.allotted, align: 'c' }, { text: r.conducted, align: 'c' },
      { text: r.pct === '' ? '' : r.pct + '%', align: 'c' }]), { ansBody: true }));
  o.push(B.note('Lecture (L), Seminar (S), Tutorial (T), Practical (P), Contact Hours (C).'));

    [{ text: '(b)', align: 'c' }, 'Teaching load in excess of UGC norm (max. score: 10)', { text: fmt(t.c1.b), align: 'c', bold: true, a: true }]
  ]));

  o.push(B.p('(ii)  Reading / instructional material consulted and additional knowledge resources provided to students', { bold: true }));
  o.push(B.table([5, 24, 25, 22, 24],

    (C.c1.ii.rows || []).map((r, i) => [{ text: String(i + 1), align: 'c' }, r.course, r.consulted, r.prescribed, r.additional]),

  o.push(B.table([85, 15], [], [[
    { text: 'API score based on preparation and imparting of knowledge / instruction as per curriculum and syllabus enrichment by providing additional resources to students (max. score: 20)', bold: true },
    { text: fmt(t.c1.ii), align: 'c', bold: true, a: true }
  ]], { totLast: true }));

  o.push(B.p('(iii)  Use of participatory and innovative teaching-learning methodologies, updating of subject content, course improvement etc.', { bold: true }));
  o.push(B.table([6, 79, 15], [[{ text: 'S. No.', align: 'c' }, 'Short description', { text: 'API Score', align: 'c' }]],
    (C.c1.iii.rows || []).map((r, i) => [{ text: String(i + 1), align: 'c' }, r.desc, { text: dash(r.score), align: 'c' }])
      .concat([[{ text: 'Total Score  (Max. 20)', span: 2, bold: true, a: false }, { text: fmt(t.c1.iii), align: 'c', bold: true }]]),

    (C.c1.iv.rows || []).map((r, i) => [{ text: String(i + 1), align: 'c' }, r.type, { text: r.assigned, align: 'c' },
      { text: r.extent, align: 'c' }, { text: dash(r.score), align: 'c' }])
      .concat([[{ text: 'Total Score  (Max. 25)', span: 4, bold: true, a: false }, { text: fmt(t.c1.iv), align: 'c', bold: true }]]),
    { totLast: true, ansBody: true }));
  o.push(B.table([85, 15], [], [[{ text: 'CATEGORY-I  TOTAL  (Max. 125 · Min. required 75)', bold: true },

/* ===== render.js ===== */
/* ===================== HTML RENDERER (preview + print/PDF) ===================== */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const nl2br = (s) => esc(s).replace(/\n/g, '<br>');
/* keep the leading spaces that indent sub-items such as "  (b) Professional" */
const keepIndent = (s) => esc(s).replace(/^ +/, (m) => '&nbsp;'.repeat(m.length));
const ALIGN = { l: 'left', c: 'center', r: 'right' };

/* isAns: a cell holds something the teacher entered, so it is tinted with the
   chosen answer colour and stands apart from the printed form text. */
function cellHTML(c, tag, isAns) {
  const o = (typeof c === 'object' && c !== null) ? c : { text: c };
  const at = [];
  if (o.span) at.push('colspan="' + o.span + '"');
  if (o.rspan) at.push('rowspan="' + o.rspan + '"');
  const ans = o.a !== undefined ? o.a : !!isAns;
  const st = [];
  if (o.align) st.push('text-align:' + ALIGN[o.align]);
  if (o.bold) st.push('font-weight:bold');
  if (o.italic) st.push('font-style:italic');
  if (st.length) at.push('style="' + st.join(';') + '"');
  if (ans && String(o.text ?? '').trim()) at.push('class="av"');
  const txt = nl2br(o.text ?? '');
  return '<' + tag + ' ' + at.join(' ') + '>' + (txt || '&nbsp;') + '</' + tag + '>';
}

function tableHTML(b) {
  const tiny = b.o.tiny ? ' style="font-size:8.5pt"' : '';
  let h = '<table class="f"' + tiny + '>';
  if (b.cols && b.cols.length) {
    h += '<colgroup>' + b.cols.map((w) => '<col style="width:' + w + '%">').join('') + '</colgroup>';
  }
  if (b.head && b.head.length) {
    h += '<thead>' + b.head.map((r) => '<tr>' + r.map((c) => cellHTML(c, 'th')).join('') + '</tr>').join('') + '</thead>';
  }
  h += '<tbody>';
  const n = b.rows.length;
  b.rows.forEach((r, i) => {
    const isTot = b.o.totLast && i === n - 1;
    h += '<tr' + (isTot ? ' class="tot"' : '') + '>' +
      r.map((c) => cellHTML(c, 'td', b.o.ansBody)).join('') + '</tr>';
  });
  if (!n) h += '<tr><td colspan="' + (b.cols ? b.cols.length : 1) + '" class="blankcell">&nbsp;</td></tr>';
  h += '</tbody></table>';
  /* the wrapper only scrolls on small screens (see the screen media query);
     in print it is an inert block so rows still break across pages */
  return '<div class="tblscroll">' + h + '</div>';
}

function blockHTML(b) {
  switch (b.t) {
    case 'p': {
      const st = [];
      if (b.o.align) st.push('text-align:' + ALIGN[b.o.align]);
      if (b.o.bold) st.push('font-weight:bold');
      if (b.o.italic) st.push('font-style:italic');
      if (b.o.size) st.push('font-size:' + b.o.size + 'pt');
      st.push('margin:4pt 0');
      return '<p class="' + (b.o.ans ? 'av' : '') + '" style="' + st.join(';') + '">' + nl2br(b.text) + '</p>';
    }
    case 'banner':
      return '<div class="banner">' + b.lines.map((l) => {
        if (!l.text) return '<div style="height:' + (l.size || 6) + 'pt"></div>';
        const st = ['margin:1pt 0'];
        if (l.bold) st.push('font-weight:bold');
        if (l.italic) st.push('font-style:italic');
        if (l.size) st.push('font-size:' + l.size + 'pt');
        return '<div style="' + st.join(';') + '">' + esc(l.text) + '</div>';
      }).join('') + '</div>';
    case 'parthead':
      return '<div class="parthead">' + esc(b.text) +
        (b.sub ? '<div style="font-size:10pt;font-weight:normal;margin-top:2pt">' + esc(b.sub) + '</div>' : '') + '</div>';
    case 'sechead': return '<div class="sechead">' + esc(b.text) + '</div>';
    case 'q': return '<div class="qn">' + esc(b.n) + '.&nbsp; ' + esc(b.text) + '</div>';
    case 'ans': {
      const empty = String(b.text || '').trim() === '';
      return '<div class="ans' + (empty ? ' blank' : ' av') + '">' + (empty ? '&nbsp;' : nl2br(b.text)) + '</div>';
    }
    case 'kv':
      return '<dl class="kv">' + b.rows.map(([k, v]) => {
        const filled = String(v ?? '').trim() !== '';
        return '<dt>' + keepIndent(k) + '</dt><dd class="' + (filled ? 'plain av' : '') + '">' +
          (filled ? nl2br(v) : '&nbsp;') + '</dd>';
      }).join('') + '</dl>';
    case 'dob':
      return '<div class="dobrow">' +
        '<span class="dlab">' + esc(b.label) + '</span>' +
        '<table class="dobbox"><tr>' + ['D', 'D', 'M', 'M', 'Y', 'Y', 'Y', 'Y']
          .map((x) => '<th>' + x + '</th>').join('') + '</tr><tr>' +
        b.digits.map((x) => '<td class="av">' + esc(x || '') + '</td>').join('') + '</tr></table>' +
        '<span class="dwords">In words&nbsp; <span class="av">' + esc(b.words || '') + '</span></span>' +
        '</div>';
    case 'table': return tableHTML(b);
    case 'ol': return '<ol class="enc" start="' + b.start + '">' + b.items.map((i) => '<li>' + nl2br(i) + '</li>').join('') + '</ol>';
    case 'sig':
      return '<div class="sig"><div class="b">' + b.left.map(esc).join('<br>') +
        '</div><div class="b r">' + b.right.map(esc).join('<br>') + '</div></div>';
    case 'rule': return '<hr class="rule">';
    case 'box': return '<div class="fillbox ' + (b.h === 'tall' ? 'tall' : b.h === 'short' ? 'short' : '') + '"></div>';
    case 'choices': return '<div class="choices">' + b.items.map((i) => '<div>' + esc(i) + '</div>').join('') + '</div>';
    case 'sp': return '<div style="height:' + b.h + 'pt"></div>';
    default: return '';
  }
}

/* Split on page-break markers; each part becomes its own A4 sheet.
   A part that overruns A4 simply grows and continues onto the next printed
   page — exactly what the browser will do, so preview matches print. */
function renderHTML(blocks, meta) {
  const styleVars = 'style="--ans:' + (meta.answerColor || '#1a3a8f') + ';' +
    '--answ:' + (meta.answerBold ? '600' : 'inherit') + '"';
  const pages = [[]];
  blocks.forEach((b) => { if (b.t === 'pb') pages.push([]); else pages[pages.length - 1].push(b); });
  let label = '';
  return pages.map((pg, pi) => {
    const ph = pg.find((b) => b.t === 'parthead');
    if (ph) label = ph.text.replace(/\s+·.*$/, '');
    const foot = '<div class="foot"><span>' + esc(meta.left) + '</span><span>' + esc(meta.right) +
      '</span><span>' + esc(label) + '</span></div>';
    return '<div class="doc' + (pi === pages.length - 1 ? ' lastdoc' : '') + '" ' + styleVars + '>' +
      pg.map(blockHTML).join('') + foot + '</div>';
  }).join('') +
    /* out-of-flow running footer used only when printing, so it can never
       push content onto an extra sheet the way an in-flow footer would */
    '<div id="printfoot"><span>' + esc(meta.left) + '</span><span>' + esc(meta.right) + '</span></div>';
}


/* ===== docx.js ===== */
/* ===================== .DOCX WRITER (no dependencies) =====================
   Builds a real OOXML package in the browser: a stored (uncompressed) ZIP
   containing WordprocessingML. Opens in Word, LibreOffice, Google Docs,
   WPS and the Android/iOS Word apps.
=========================================================================== */

/* ---------- tiny ZIP (store method) ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(buf) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() / 2)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  files.forEach(({ name, data }) => {
    const nameBuf = enc.encode(name);
    const body = typeof data === 'string' ? enc.encode(data) : data;
    const crc = crc32(body);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, body.length, true); lh.setUint32(22, body.length, true);
    lh.setUint16(26, nameBuf.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nameBuf, body);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, body.length, true); ch.setUint32(24, body.length, true);
    ch.setUint16(28, nameBuf.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), nameBuf);
    offset += 30 + nameBuf.length + body.length;
  });

  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(8, files.length, true);
  eocd.setUint16(10, files.length, true); eocd.setUint32(12, cdSize, true); eocd.setUint32(16, offset, true);
  const all = parts.concat(central, [new Uint8Array(eocd.buffer)]);
  const total = all.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let p = 0; all.forEach((a) => { out.set(a, p); p += a.length; });
  return new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

/* ---------- WordprocessingML helpers ---------- */
const X = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
const CW = 10318;                    // usable width in twips (A4 minus 14 mm margins)
const BASE = 21;                     // 10.5 pt, in half-points
const HEADFILL = 'E8EEF4';

/* Answer runs are tinted with the colour chosen in the app. DOCX wants a bare
   RRGGBB hex, so strip any leading '#'. */
let ANSWER_COLOR = '1A3A8F', ANSWER_BOLD = false;
function setAnswerStyle(hex, bold) {
  ANSWER_COLOR = String(hex || '#1A3A8F').replace('#', '').toUpperCase().slice(0, 6) || '1A3A8F';
  ANSWER_BOLD = !!bold;
}

function runs(text, r) {
  r = r || {};
  const bold = r.bold || (r.ans && ANSWER_BOLD);
  const rpr = '<w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>' +
    (bold ? '<w:b/>' : '') + (r.italic ? '<w:i/>' : '') +
    (r.ans ? '<w:color w:val="' + ANSWER_COLOR + '"/>' : '') +
    '<w:sz w:val="' + (r.size ? Math.round(r.size * 2) : BASE) + '"/>' +
    '<w:szCs w:val="' + (r.size ? Math.round(r.size * 2) : BASE) + '"/></w:rPr>';
  const lines = String(text ?? '').split('\n');
  return lines.map((ln, i) =>
    '<w:r>' + rpr + (i ? '<w:br/>' : '') + '<w:t xml:space="preserve">' + X(ln) + '</w:t></w:r>').join('');
}
function para(text, o) {
  o = o || {};
  let ppr = '<w:pPr>';
  if (o.border) {
    ppr += '<w:pBdr>';
    if (o.border === 'left') ppr += '<w:left w:val="single" w:sz="12" w:space="6" w:color="9AA9B8"/>';
    if (o.border === 'bottom') ppr += '<w:bottom w:val="single" w:sz="12" w:space="2" w:color="000000"/>';
    if (o.border === 'dot') ppr += '<w:bottom w:val="dotted" w:sz="6" w:space="1" w:color="555555"/>';
    ppr += '</w:pBdr>';
  }
  if (o.fill) ppr += '<w:shd w:val="clear" w:color="auto" w:fill="' + o.fill + '"/>';
  ppr += '<w:spacing w:before="' + (o.before ?? 40) + '" w:after="' + (o.after ?? 40) + '" w:line="240" w:lineRule="auto"/>';
  if (o.indent) ppr += '<w:ind w:left="' + o.indent + '"/>';
  if (o.align) ppr += '<w:jc w:val="' + ({ l: 'left', c: 'center', r: 'right' }[o.align] || o.align) + '"/>';
  ppr += '</w:pPr>';
  return '<w:p>' + ppr + runs(text, o) + '</w:p>';
}
const emptyPara = (pt) => '<w:p><w:pPr><w:spacing w:before="0" w:after="0"/><w:rPr><w:sz w:val="' +
  Math.max(2, Math.round((pt || 6) * 2)) + '"/></w:rPr></w:pPr></w:p>';
const pageBreak = () => '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';

function gridify(cols, headRows, bodyRows) {
  const W = cols.length, out = [];
  const carry = new Array(W).fill(0), carryW = new Array(W).fill(1);
  const all = (headRows || []).map((r) => ({ cells: r, head: true }))
    .concat((bodyRows || []).map((r) => ({ cells: r, head: false })));
  all.forEach((ro) => {
    const row = []; let ci = 0, src = 0;
    while (ci < W) {
      if (carry[ci] > 0) {
        const sp = carryW[ci];
        row.push({ text: '', vmerge: 'cont', span: sp, _col: ci, head: ro.head });
        for (let k = 0; k < sp && ci + k < W; k++) carry[ci + k]--;
        ci += sp; continue;
      }
      const c = ro.cells[src++];
      if (c === undefined) { row.push({ text: '', span: 1, _col: ci, head: ro.head }); ci++; continue; }
      const o = (typeof c === 'object' && c !== null) ? Object.assign({}, c) : { text: c };
      const sp = o.span || 1;
      if (o.rspan && o.rspan > 1) {
        o.vmerge = 'restart';
        for (let k = 0; k < sp && ci + k < W; k++) { carry[ci + k] = o.rspan - 1; carryW[ci + k] = sp; }
      }
      o.span = sp; o._col = ci; o.head = ro.head;
      row.push(o); ci += sp;
    }
    out.push(row);
  });
  return out;
}

function tableXML(cols, headRows, bodyRows, opt) {
  opt = opt || {};
  const widths = cols.map((p) => Math.round((p / 100) * CW));
  const bd = opt.noBorder
    ? '<w:tblBorders><w:top w:val="none"/><w:left w:val="none"/><w:bottom w:val="none"/><w:right w:val="none"/><w:insideH w:val="none"/><w:insideV w:val="none"/></w:tblBorders>'
    : '<w:tblBorders>' + ['top', 'left', 'bottom', 'right', 'insideH', 'insideV']
      .map((s) => '<w:' + s + ' w:val="single" w:sz="6" w:space="0" w:color="000000"/>').join('') + '</w:tblBorders>';
  let x = '<w:tbl><w:tblPr><w:tblW w:w="' + CW + '" w:type="dxa"/><w:tblLayout w:type="fixed"/>' + bd +
    '<w:tblCellMar><w:top w:w="30" w:type="dxa"/><w:left w:w="60" w:type="dxa"/>' +
    '<w:bottom w:w="30" w:type="dxa"/><w:right w:w="60" w:type="dxa"/></w:tblCellMar></w:tblPr>' +
    '<w:tblGrid>' + widths.map((w) => '<w:gridCol w:w="' + w + '"/>').join('') + '</w:tblGrid>';

  const grid = gridify(cols, headRows, bodyRows);
  const nHead = (headRows || []).length;
  const nBody = (bodyRows || []).length;
  grid.forEach((row, ri) => {
    const isHead = ri < nHead;
    const isTot = opt.totLast && ri === nHead + nBody - 1;
    x += '<w:tr><w:trPr><w:cantSplit/>' + (isHead ? '<w:tblHeader/>' : '') +
      (opt.rowHeight ? '<w:trHeight w:val="' + opt.rowHeight + '"/>' : '') + '</w:trPr>';
    row.forEach((c) => {
      let w = 0;
      for (let k = 0; k < c.span; k++) w += widths[c._col + k] || 0;
      let tcpr = '<w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/>';
      if (c.span > 1) tcpr += '<w:gridSpan w:val="' + c.span + '"/>';
      if (c.vmerge) tcpr += '<w:vMerge' + (c.vmerge === 'restart' ? ' w:val="restart"' : '') + '/>';
      if (c.underline) tcpr += '<w:tcBorders><w:bottom w:val="dotted" w:sz="6" w:space="0" w:color="555555"/></w:tcBorders>';
      const fill = isHead ? HEADFILL : (isTot ? 'F2F4F7' : (c.fill || null));
      if (fill) tcpr += '<w:shd w:val="clear" w:color="auto" w:fill="' + fill + '"/>';
      tcpr += '<w:vAlign w:val="top"/></w:tcPr>';
      const align = c.align || (isHead ? 'c' : 'l');
      const ans = c.a !== undefined ? c.a : (!isHead && !!opt.ansBody);
      x += '<w:tc>' + tcpr + para(c.text, {
        bold: !!(c.bold || isHead || isTot), italic: !!c.italic, align, ans: ans && !isHead,
        size: opt.tiny ? 8.5 : (c.size || 9.5), before: 20, after: 20
      }) + '</w:tc>';
    });
    x += '</w:tr>';
  });
  return x + '</w:tbl>' + emptyPara(4);
}

function blockDOCX(b) {
  switch (b.t) {
    case 'p': return para(b.text, { bold: b.o.bold, italic: b.o.italic, size: b.o.size, align: b.o.align, ans: b.o.ans });
    case 'dob': {
      /* label | eight fixed 300-twip boxes | "In words …" — a nested table so
         the strip keeps its own narrow width instead of filling the page */
      const cell = (t, head) =>
        '<w:tc><w:tcPr><w:tcW w:w="300" w:type="dxa"/>' +
        (head ? '<w:tcBorders><w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/></w:tcBorders>' : '') +
        '<w:vAlign w:val="center"/></w:tcPr>' +
        para(t, { align: 'c', size: head ? 9.5 : 11, before: 0, after: 0, ans: !head }) + '</w:tc>';
      const strip =
        '<w:tbl><w:tblPr><w:tblW w:w="2400" w:type="dxa"/><w:tblLayout w:type="fixed"/>' +
        '<w:tblBorders>' + ['top', 'left', 'bottom', 'right', 'insideH', 'insideV']
          .map((s) => '<w:' + s + ' w:val="single" w:sz="6" w:space="0" w:color="000000"/>').join('') +
        '</w:tblBorders><w:tblCellMar><w:top w:w="10" w:type="dxa"/><w:left w:w="10" w:type="dxa"/>' +
        '<w:bottom w:w="10" w:type="dxa"/><w:right w:w="10" w:type="dxa"/></w:tblCellMar></w:tblPr>' +
        '<w:tblGrid>' + '<w:gridCol w:w="300"/>'.repeat(8) + '</w:tblGrid>' +
        '<w:tr>' + ['D', 'D', 'M', 'M', 'Y', 'Y', 'Y', 'Y'].map((t) => cell(t, true)).join('') + '</w:tr>' +
        '<w:tr>' + b.digits.map((t) => cell(t, false)).join('') + '</w:tr></w:tbl>' + emptyPara(2);
      const outerCell = (w, inner) =>
        '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/><w:vAlign w:val="bottom"/></w:tcPr>' + inner + '</w:tc>';
      return '<w:tbl><w:tblPr><w:tblW w:w="' + CW + '" w:type="dxa"/><w:tblLayout w:type="fixed"/>' +
        '<w:tblBorders><w:top w:val="none"/><w:left w:val="none"/><w:bottom w:val="none"/>' +
        '<w:right w:val="none"/><w:insideH w:val="none"/><w:insideV w:val="none"/></w:tblBorders>' +
        '<w:tblCellMar><w:left w:w="0" w:type="dxa"/><w:right w:w="140" w:type="dxa"/></w:tblCellMar></w:tblPr>' +
        '<w:tblGrid><w:gridCol w:w="2050"/><w:gridCol w:w="2450"/><w:gridCol w:w="' + (CW - 4500) + '"/></w:tblGrid>' +
        '<w:tr><w:trPr><w:cantSplit/></w:trPr>' +
        outerCell(2050, para(b.label, { bold: true, before: 60, after: 60 })) +
        outerCell(2450, strip) +
        outerCell(CW - 4500, para('In words   ' + (b.words || ''), { before: 60, after: 60, ans: true, size: 10 })) +
        '</w:tr></w:tbl>' + emptyPara(4);
    }
    case 'banner':
      return tableXML([100], [], [[{
        text: b.lines.filter((l) => l.text).map((l) => l.text).join('\n'), align: 'c', bold: true
      }]], { noBorder: false }).replace(/<w:sz w:val="19"\/>/g, '<w:sz w:val="24"/>');
    case 'parthead':
      return tableXML([100], [], [[{
        text: b.text + (b.sub ? '\n' + b.sub : ''), align: 'c', bold: true, fill: HEADFILL, size: 11.5
      }]], {});
    case 'sechead': return para(b.text, { bold: true, size: 11.5, border: 'bottom' });
    case 'q': return para(b.n + '.  ' + b.text, { bold: true, before: 120 });
    case 'ans': {
      const empty = String(b.text || '').trim() === '';
      return para(empty ? ' ' : b.text, { border: 'left', indent: 120, after: 120, ans: !empty }) +
        (empty ? emptyPara(14) : '');
    }
    case 'kv':
      /* empty values get a dotted rule so the sheet can be completed by hand */
      return tableXML([44, 56], [], b.rows.map(([k, v]) => {
        const filled = String(v ?? '').trim() !== '';
        return [{ text: k, size: 10, a: false }, { text: filled ? v : ' ', size: 10, underline: !filled, a: filled }];
      }), { noBorder: true });
    case 'table': return tableXML(b.cols, b.head, b.rows, b.o);
    case 'ol': return b.items.map((it, i) => para((b.start + i) + '.  ' + it, { indent: 240 })).join('');
    case 'sig':
      return tableXML([50, 50], [], [[
        { text: b.left.join('\n'), size: 10 }, { text: b.right.join('\n'), size: 10 }
      ]], { noBorder: true });
    case 'rule': return para(' ', { border: 'bottom', size: 2 });
    case 'box':
      return tableXML([100], [], [[{ text: ' ' }]],
        { rowHeight: b.h === 'tall' ? 2200 : b.h === 'short' ? 700 : 1300 });
    case 'choices': return b.items.map((i) => para(i, { indent: 300, before: 10, after: 10, size: 10 })).join('');
    case 'sp': return emptyPara(b.h);
    case 'pb': return pageBreak();
    default: return '';
  }
}

function buildDocx(blocks, meta) {

    '<w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText xml:space="preserve"> PAGE </w:instrText></w:r>' +
    '<w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:t>1</w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r>' +
    '<w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:sz w:val="16"/><w:color w:val="555555"/></w:rPr><w:t xml:space="preserve"> of </w:t></w:r>' +
    '<w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText xml:space="preserve"> NUMPAGES </w:instrText></w:r>' +
    '<w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:t>1</w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r>' +
    '</w:p></w:ftr>';
