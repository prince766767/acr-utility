    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    '<w:docDefaults><w:rPrDefault><w:rPr>' +
    '<w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>' +
    '<w:sz w:val="' + BASE + '"/><w:szCs w:val="' + BASE + '"/></w:rPr></w:rPrDefault>' +
    '<w:pPrDefault><w:pPr><w:spacing w:after="40" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault>' +
    '</w:docDefaults>' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>' +
    '</w:styles>';

  const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
    '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>' +
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
    '</Types>';

  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
    '</Relationships>';

  const drels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId9" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '<Relationship Id="rId10" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>' +
    '</Relationships>';

  const core = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" ' +
    'xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" ' +
    'xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
    '<dc:title>' + X(meta.title) + '</dc:title><dc:creator>' + X(meta.author) + '</dc:creator>' +
    '<cp:lastModifiedBy>' + X(meta.author) + '</cp:lastModifiedBy>' +
    '<dcterms:created xsi:type="dcterms:W3CDTF">' + new Date().toISOString().slice(0, 19) + 'Z</dcterms:created>' +
    '</cp:coreProperties>';

  return zipStore([
    { name: '[Content_Types].xml', data: ct },
    { name: '_rels/.rels', data: rels },
    { name: 'docProps/core.xml', data: core },
    { name: 'word/document.xml', data: document },
    { name: 'word/_rels/document.xml.rels', data: drels },
    { name: 'word/styles.xml', data: styles },
    { name: 'word/footer1.xml', data: footer }
  ]);
}


/* ===== sync.js ===== */
/* ===================== LINKED-FILE SYNC =====================
   Points the utility at one file the user chooses — normally inside a
   Google Drive / OneDrive folder that the desktop client keeps in the cloud.
   Every save is written into that file; every start reads it back and merges.
   Needs the File System Access API: Chrome and Edge on Windows, macOS and
   Android. Safari and Firefox fall back to manual export / import.
============================================================== */

const SYNC_SUPPORTED = typeof window !== 'undefined' &&
  typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';

const SYNC = { handle: null, name: '', state: 'off', last: null, busy: false, timer: null };
/* state: off | linked | needs-permission | syncing | error | unsupported */

/* ---------- the handle has to live in IndexedDB; localStorage cannot hold it ---------- */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('acr-sync', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('handles');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbPut(k, v) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(v, k);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(k) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('handles');
    const q = tx.objectStore('handles').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
async function idbDel(k) {
  const db = await idb();
  return new Promise((res) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').delete(k); tx.oncomplete = res;
  });
}

/* ---------- merge: newest edit of each year wins ----------
   Pure and side-effect free so it can be tested on its own.            */
function mergeDocs(localDocs, remoteDocs) {
  const map = new Map();
  const stamp = (d) => Date.parse(d && d.updatedAt) || 0;
  const report = { added: [], updated: [], kept: [], dropped: [], total: 0 };

  const remote = (remoteDocs || []).filter((d) => d && d.id);
  const remoteIds = new Set(remote.map((d) => d.id));
  /* A year this device created but never edited is not data — it is the app's
     own starting point. If the sync file already holds years, drop it rather
     than pushing a duplicate into the shared file. */
  (localDocs || []).forEach((d) => {
    if (!d || !d.id) return;
    if (remote.length && d.touched === false && !remoteIds.has(d.id)) { report.dropped.push(d.session || d.id); return; }
    map.set(d.id, d);
  });
  remote.forEach((d) => {
    if (!d || !d.id) return;
    const mine = map.get(d.id);
    if (!mine) { map.set(d.id, d); report.added.push(d.session || d.id); return; }
    /* Work always beats a never-edited copy, whatever the clock says: a device
       that has only just been set up carries a fresh timestamp but no content. */
    const t1 = !!d.touched, t2 = !!mine.touched;
    const remoteWins = t1 !== t2 ? t1 : stamp(d) > stamp(mine);
    if (remoteWins) { map.set(d.id, d); report.updated.push(d.session || d.id); }
    else report.kept.push(d.session || d.id);
  });

  const docs = Array.from(map.values()).sort((a, b) => Date.parse(b.updatedAt) - Date.parse(a.updatedAt));
  report.total = docs.length;
  return { docs, report };
}

/* ---------- permission ---------- */
async function syncPermission(request) {
  if (!SYNC.handle || typeof SYNC.handle.queryPermission !== 'function') return 'denied';
  const opt = { mode: 'readwrite' };
  try {
    let p = await SYNC.handle.queryPermission(opt);
    if (p !== 'granted' && request) p = await SYNC.handle.requestPermission(opt);
    return p;
  } catch (e) { return 'denied'; }
}

/* ---------- read / write ---------- */
async function syncRead() {
  const file = await SYNC.handle.getFile();
  const text = await file.text();
  if (!text.trim()) return [];
  const raw = JSON.parse(text);
  if (raw.kind !== 'acr-backup' || !Array.isArray(raw.docs)) throw new Error('That file is not an ACR backup.');
  return raw.docs;
}
async function syncWrite(docs) {
  const w = await SYNC.handle.createWritable();
  await w.write(JSON.stringify({ kind: 'acr-backup', version: 1, exportedAt: nowISO(), docs }, null, 2));
  await w.close();
}

/* ---------- link / unlink ---------- */
async function syncLink(mode) {
  if (!SYNC_SUPPORTED) { toast('This browser cannot link a file. Use Export / Import instead.', 5000); return; }
  try {
    const opts = {
      suggestedName: 'ACR-sync.acrbak.json',
      types: [{ description: 'ACR backup', accept: { 'application/json': ['.json'] } }]
    };
    SYNC.handle = mode === 'open'
      ? (await window.showOpenFilePicker({ ...opts, multiple: false }))[0]
      : await window.showSaveFilePicker(opts);
    SYNC.name = SYNC.handle.name;
    SYNC.state = 'linked';
    lsSet('acr.sync.name', SYNC.name);

    /* remembering the handle is a convenience, not a precondition — if the
       browser refuses to store it, sync still works for this session */
    let remembered = true;
    try { await idbPut('syncFile', SYNC.handle); } catch (e) { remembered = false; }

    await syncRun(true);
    toast(remembered
      ? 'Linked to ' + SYNC.name + '. It will now update itself on every save.'
      : 'Linked to ' + SYNC.name + ' for this session. This browser would not remember the link, so you will need to link it again next time.',
      remembered ? 4500 : 7000);
  } catch (e) {
    if (e && e.name === 'AbortError') return;          // user closed the picker
    SYNC.state = 'error'; syncPaint();
    toast('Could not link that file: ' + e.message, 5000);
  }
}
async function syncUnlink() {
  SYNC.handle = null; SYNC.name = ''; SYNC.state = 'off'; SYNC.last = null;
  await idbDel('syncFile'); lsDel('acr.sync.name');
  syncPaint(); render();
  toast('Sync file unlinked. Your years stay on this device.');
}

/* ---------- the sync cycle: read, merge, write ---------- */
async function syncRun(loud) {
  if (!SYNC.handle || SYNC.busy) return;
  const perm = await syncPermission(false);
  if (perm !== 'granted') { SYNC.state = 'needs-permission'; syncPaint(); return; }

  SYNC.busy = true; SYNC.state = 'syncing'; syncPaint();
  try {
    const localDocs = loadIndex().map((r) => loadDocById(r.id)).filter(Boolean);
    let remoteDocs = [];
    try { remoteDocs = await syncRead(); }
    catch (e) { if (!/not an ACR backup/.test(e.message)) remoteDocs = []; else throw e; }

    const { docs, report } = mergeDocs(localDocs, remoteDocs.map(migrate));

    /* adopt anything the other device edited more recently */
    const openId = S.doc && S.doc.id;
    const keep = new Set(docs.map((d) => d.id));
    let changed = false;
    /* mergeDocs already decided every winner — do not second-guess it here,
       just store whatever differs from what this device currently holds */
    docs.forEach((d) => {
      const next = JSON.stringify(d);
      if (lsGet(LS_DOC(d.id)) === next) return;
      lsSet(LS_DOC(d.id), next);
      if (d.id === openId) S.doc = migrate(d);
      changed = true;
    });
    /* clear out pristine starter years the merge discarded */
    loadIndex().forEach((r) => { if (!keep.has(r.id)) { lsDel(LS_DOC(r.id)); changed = true; } });
    saveIndex(docs.map((d) => ({ id: d.id, session: d.session, name: d.p1.fullName, updatedAt: d.updatedAt })));

    /* the year on screen may have just been discarded — open the newest instead */
    if (!keep.has(openId) && docs.length) { S.doc = migrate(docs[0]); lsSet(LS_CUR, S.doc.id); changed = true; }

    await syncWrite(docs);
    SYNC.last = new Date(); SYNC.state = 'linked';

    if (changed) render();
    const n = report.added.length + report.updated.length;
    if (n) toast('Pulled in ' + n + ' newer year' + (n > 1 ? 's' : '') + ' from ' + SYNC.name + '.', 4000);
    else if (loud) toast('Synced with ' + SYNC.name + '.');
  } catch (e) {
    SYNC.state = 'error';
    toast('Sync failed: ' + e.message + ' — your work is still safe on this device.', 6000);
  } finally {
    SYNC.busy = false; syncPaint();
  }
}

/* write-behind: a save every few keystrokes should not hammer the disk */
function syncSchedule() {
  if (!SYNC.handle || SYNC.state === 'needs-permission') return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => syncRun(false), 4000);
}

/* ---------- status chip ---------- */
function syncPaint() {
  const el = $('#syncStatus'); if (!el) return;
  const time = SYNC.last ? SYNC.last.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  const M = {
    off: ['', ''],
    unsupported: ['', ''],
    linked: ['synced' + (time ? ' · ' + time : ''), 'saved'],
    syncing: ['syncing…', 'dirty'],
    'needs-permission': ['sync paused — tap to reconnect', 'dirty'],
    error: ['sync error — tap to retry', 'dirty']
  };
  const [text, cls] = M[SYNC.state] || ['', ''];
  el.textContent = text;
  el.className = 'btn ghost sm status ' + cls;
  el.style.display = text ? '' : 'none';
  el.style.cursor = (SYNC.state === 'needs-permission' || SYNC.state === 'error') ? 'pointer' : 'default';
  const note = $('#syncNote');
  if (note) note.innerHTML = syncNoteHTML();
}

function syncNoteHTML() {
  if (!SYNC_SUPPORTED) {
    return '<div class="notice">This browser cannot link a file — that needs Chrome or Edge. ' +
      'Use <b>Export backup</b> and <b>Import a backup</b> above to move years between devices.</div>';
  }
  if (!SYNC.handle) {
    return '<p class="hint">Not linked. Pick a file inside your Google Drive or OneDrive folder and ' +
      'this device will keep it up to date by itself.</p>';
  }
  const t = SYNC.last ? 'Last synced at ' + SYNC.last.toLocaleTimeString() + '.' : 'Not synced yet this session.';
  if (SYNC.state === 'needs-permission') {
    return '<div class="notice">Linked to <b>' + esc(SYNC.name) + '</b>, but the browser needs your ' +
      'permission again for this session. Press <b>Sync now</b> and allow access.</div>';
  }
  return '<p class="hint">Linked to <b>' + esc(SYNC.name) + '</b>. ' + esc(t) +
    ' Saves are written to it a few seconds after you stop typing.</p>';
}

/* ---------- boot ---------- */
async function syncBoot() {
  if (!SYNC_SUPPORTED) { SYNC.state = 'unsupported'; syncPaint(); return; }
  try {
    const h = await idbGet('syncFile');
    if (!h) { syncPaint(); return; }
    SYNC.handle = h; SYNC.name = h.name || lsGet('acr.sync.name') || 'sync file';
    const perm = await syncPermission(false);
    SYNC.state = perm === 'granted' ? 'linked' : 'needs-permission';
    syncPaint();
    if (perm === 'granted') await syncRun(false);
  } catch (e) { SYNC.state = 'error'; syncPaint(); }
}


/* ===== auth.js ===== */
/* ===================== GOOGLE SIGN-IN (Google Identity Services) =====================
   Lazy by design: nothing here runs, and no request to accounts.google.com is made,
   until a teacher has previously signed in (authBoot) or clicks Sign in (authSignIn).
   This file knows nothing about Google Drive or the ACR document model — see drive.js
   and drivesync.js for that.
========================================================================================= */

const AUTH_SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile';
const AUTH_MARKER_KEY = 'acr.auth.account';

const AUTH = { state: 'signed-out', token: null, tokenExpiry: 0, account: null };
let AUTH_LISTENERS = [];
let AUTH_TOKEN_CLIENT = null;
let AUTH_GIS_PROMISE = null;

function onAuthChange(fn) { AUTH_LISTENERS.push(fn); }
function authFireChange() { AUTH_LISTENERS.forEach((fn) => { try { fn(AUTH); } catch (e) {} }); }

function authClientId() {
  const m = document.querySelector('meta[name="google-client-id"]');
  return (m && m.content || '').trim();
}
function authAvailable() { return location.protocol !== 'file:' && !!authClientId(); }

function authLoadGis() {
  if (AUTH_GIS_PROMISE) return AUTH_GIS_PROMISE;
  AUTH_GIS_PROMISE = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Could not load Google Sign-In. Check your internet connection.'));
    document.head.appendChild(s);
  });
  return AUTH_GIS_PROMISE;
}

function authEnsureTokenClient() {
  if (AUTH_TOKEN_CLIENT) return AUTH_TOKEN_CLIENT;
  AUTH_TOKEN_CLIENT = google.accounts.oauth2.initTokenClient({
    client_id: authClientId(),
    scope: AUTH_SCOPES,
    callback: () => {} // overridden per-call in authRequestToken
  });
  return AUTH_TOKEN_CLIENT;
}

function authRequestToken(promptMode) {
  return authLoadGis().then(() => new Promise((resolve, reject) => {
    const client = authEnsureTokenClient();
    client.callback = (resp) => {
      if (resp && resp.access_token) resolve(resp);
      else reject(Object.assign(new Error('Sign-in was not completed.'), { needsSignIn: true }));
    };
    client.error_callback = (err) => reject(Object.assign(new Error((err && err.message) || 'Sign-in failed.'), { needsSignIn: true }));
    client.requestAccessToken({ prompt: promptMode });
  }));
}

async function authFetchUserinfo(token) {
  const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + token } });
  if (!r.ok) throw new Error('Could not read the signed-in account.');
  const j = await r.json();
  return { sub: j.sub, email: j.email || '', name: j.name || '' };
}

async function authSignIn() {
  if (!authAvailable()) throw new Error(location.protocol === 'file:'
    ? 'Google sign-in needs the hosted version of this app.'
    : 'Google sign-in is not configured for this deployment yet.');
  AUTH.state = 'signing-in'; authFireChange();
  try {
    const resp = await authRequestToken('consent');
    AUTH.token = resp.access_token;
    AUTH.tokenExpiry = Date.now() + (Number(resp.expires_in) || 3300) * 1000;
    AUTH.account = await authFetchUserinfo(AUTH.token);
    gRawSet(AUTH_MARKER_KEY, JSON.stringify(AUTH.account));
    AUTH.state = 'signed-in'; authFireChange();
  } catch (e) {
    AUTH.state = 'error'; authFireChange();
    throw e;
  }
}

async function authSignOut() {
  const token = AUTH.token;
  AUTH.token = null; AUTH.tokenExpiry = 0; AUTH.account = null; AUTH.state = 'signed-out';
  gRawDel(AUTH_MARKER_KEY);
  authFireChange();
  if (token && window.google && google.accounts && google.accounts.oauth2) {
    try { google.accounts.oauth2.revoke(token, () => {}); } catch (e) {}
  }
}

async function authGetToken() {
  if (AUTH.token && Date.now() < AUTH.tokenExpiry - 30000) return AUTH.token;
  try {
    const resp = await authRequestToken('');
    AUTH.token = resp.access_token;
    AUTH.tokenExpiry = Date.now() + (Number(resp.expires_in) || 3300) * 1000;
    if (!AUTH.account) AUTH.account = await authFetchUserinfo(AUTH.token);
    AUTH.state = 'signed-in'; authFireChange();
    return AUTH.token;
  } catch (e) {
    AUTH.state = 'error'; authFireChange();
    throw Object.assign(e, { needsSignIn: true });
  }
}

function authBoot() {
  const raw = gRawGet(AUTH_MARKER_KEY);
  if (!raw) return; // never signed in on this device — make zero network calls
  try { AUTH.account = JSON.parse(raw); AUTH.state = 'signed-in'; } catch (e) { return; }
  authFireChange();
  // attempt a silent token refresh in the background so sync can start without a click
  authGetToken().catch(() => { AUTH.state = 'error'; authFireChange(); });
}


/* ===== drive.js ===== */
/* ===================== GOOGLE DRIVE REST MODULE =====================
   Pure functions of (token, ...). Knows nothing about sign-in state or
   the app's document model beyond the small subset of fields it reads
   (id, session, schemaVersion, rev) to tag files for later lookup.
   Scope used everywhere this module is called: drive.file — every request
   below only ever touches files/folders this app itself created.
======================================================================== */

const DRIVE_API = 'https://www.googleapis.com/drive/v3';
const DRIVE_UPLOAD_API = 'https://www.googleapis.com/upload/drive/v3';

async function driveApiFetch(token, url, opts) {
  const r = await fetch(url, Object.assign({}, opts, {
    headers: Object.assign({ Authorization: 'Bearer ' + token }, (opts && opts.headers) || {})
  }));
  if (!r.ok) {
    /* Capture Google's own error message so a real API failure (wrong scope, Drive API
       not enabled, malformed request, etc.) is distinguishable from "no network reached
       Google at all" — never includes the token or any ACR content, only Drive's own
       short error description. */
    let reason = '';
    try { const body = await r.json(); reason = (body && body.error && body.error.message) || ''; } catch (e) {}
    const err = new Error('Drive request failed (' + r.status + ')' + (reason ? ': ' + reason : ''));
    err.status = r.status;                 // presence of .status proves a real HTTP response came back — i.e. we are not offline
    if (r.status === 401) err.needsSignIn = true; // token invalid/expired — re-signing in resolves this specifically
    throw err;
  }
  return r.json();
}

function driveQuery(parts) { return parts.join(' and '); }

async function driveFindByProperty(token, key, value, extra) {
  const q = driveQuery([
    "properties has { key='" + key + "' and value='" + value + "' }",
    'trashed=false'
  ].concat(extra || []));
  const url = DRIVE_API + '/files?q=' + encodeURIComponent(q) + '&fields=' + encodeURIComponent('files(id,name,modifiedTime,properties)');
  const data = await driveApiFetch(token, url);
  return (data.files && data.files[0]) || null;
}

async function driveCreateFolder(token, name, properties, parentId) {
  const body = { name, mimeType: 'application/vnd.google-apps.folder', properties };
  if (parentId) body.parents = [parentId];
  const data = await driveApiFetch(token, DRIVE_API + '/files', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  return data.id;
}

async function driveEnsureWorkspace(token) {
  const root = await driveFindByProperty(token, 'appTag', 'acr-utility-root');
  const rootId = root ? root.id : await driveCreateFolder(token, 'ACR Utility', { appTag: 'acr-utility-root' });

  const backups = await driveFindByProperty(token, 'appTag', 'acr-utility-backups', ["'" + rootId + "' in parents"]);
  const backupsId = backups ? backups.id : await driveCreateFolder(token, 'Backups', { appTag: 'acr-utility-backups' }, rootId);

  return { rootId, backupsId };
}

async function driveListYearFiles(token, rootId) {
  const q = driveQuery([
    "'" + rootId + "' in parents",
    'trashed=false',
    "properties has { key='appTag' and value='acr-utility-year-file' }"
  ]);
  const url = DRIVE_API + '/files?q=' + encodeURIComponent(q) + '&fields=' + encodeURIComponent('files(id,name,modifiedTime,properties)');
  const data = await driveApiFetch(token, url);
  return data.files || [];
}

async function driveGetFileContent(token, fileId) {
  const url = DRIVE_API + '/files/' + fileId + '?alt=media';
  return driveApiFetch(token, url);
}

async function driveUpsertYearFile(token, rootId, doc, existingFileId) {
  const name = 'ACR ' + (doc.session || 'untitled') + '.acr.json';
  const properties = { appTag: 'acr-utility-year-file', acrDocId: doc.id, schemaVersion: String(doc.schemaVersion) };
  const media = JSON.stringify(doc);

  if (!existingFileId) {
    const boundary = 'acrutil' + Date.now();
    const metadata = { name, parents: [rootId], properties };
    const body =
      '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
      '--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + media + '\r\n' +
      '--' + boundary + '--';
    const data = await driveApiFetch(token, DRIVE_UPLOAD_API + '/files?uploadType=multipart', {
      method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body
    });
    return data.id;
  }

  await driveApiFetch(token, DRIVE_API + '/files/' + existingFileId, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, properties })
  });
  await driveApiFetch(token, DRIVE_UPLOAD_API + '/files/' + existingFileId + '?uploadType=media', {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: media
  });
  return existingFileId;
}

async function driveTrashFile(token, fileId) {
  await driveApiFetch(token, DRIVE_API + '/files/' + fileId, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true })
  });
}

async function driveWriteBackupSnapshot(token, backupsId, allDocs) {
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const name = 'backup-' + stamp + '.acrbak.json';
  const pack = { kind: 'acr-backup', version: 1, exportedAt: new Date().toISOString(), docs: allDocs };
  const boundary = 'acrutilbk' + Date.now();
  const metadata = { name, parents: [backupsId], properties: { appTag: 'acr-utility-backup-snapshot' } };
  const body =
    '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) + '\r\n' +
    '--' + boundary + '\r\nContent-Type: application/json\r\n\r\n' + JSON.stringify(pack) + '\r\n' +
    '--' + boundary + '--';
  const data = await driveApiFetch(token, DRIVE_UPLOAD_API + '/files?uploadType=multipart', {
    method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body
  });
  return data.id;
}

if (typeof module !== 'undefined' && module.exports) {

/* ===== drivesync.js ===== */
/* ===================== DRIVE SYNC ORCHESTRATION =====================
   Ties auth.js + drive.js to the existing local document store. This file
   owns: which account namespace is active, the first-sign-in migration
   offer, and (from here on down) the automatic sync loop.
========================================================================= */

function driveNamespaceFor(account) { return 'acct.' + account.sub + '.'; }

/* Only offer to migrate local data that was actually edited — a fresh, never-touched
   starter document is not real work, so there is nothing worth carrying over. */
function offerMigrationIfNeeded(account) {
  const hadLocalWork = loadIndex().some((r) => {
    const d = loadDocById(r.id);
    return d && d.touched;
  });
  if (!hadLocalWork) return false;
  return confirm('Existing ACR data found on this device. Would you like to add it to your Google account?');
}

/* ---------- conflict-aware merge, layered on top of the existing per-year rule ----------
   mergeDocs() (sync.js) already gets the common cases right: newest updatedAt wins, and an
   untouched starter copy never beats real work. The only new case Drive introduces is two
   *touched* copies that diverged independently since they last agreed — that can only happen
   if both devices edited the same year while both were offline.

   Why "equal rev" is the divergence signal: persist() increments rev by exactly 1 on every
   real edit, and a successful sync always writes both sides back at the SAME rev (via
   {touch:false}, which does not bump it). So immediately after any sync, local.rev ===
   remote.rev by construction. From that shared point, if only one side is edited further,
   its rev pulls strictly ahead while the other stays behind — an ordinary, safely-resolved
   case (the behind side simply hasn't changed since the two last agreed). But if BOTH sides
   are edited independently before reconnecting, each advances by its own +1 steps from that
   same shared rev — landing back on the *same* rev number with genuinely different content.
   Equal revs with different content is therefore exactly the fingerprint of two independent
   offline edits, and unequal revs is exactly the fingerprint of one side simply being behind. */
function mergeDocsWithConflicts(localDocs, remoteDocs) {
  const { docs, report } = mergeDocs(localDocs, remoteDocs);
  const conflicts = [];
  const localById = new Map((localDocs || []).filter((d) => d && d.id).map((d) => [d.id, d]));
  const remoteById = new Map((remoteDocs || []).filter((d) => d && d.id).map((d) => [d.id, d]));

  docs.forEach((winner) => {
    const local = localById.get(winner.id);
    const remote = remoteById.get(winner.id);
    if (!local || !remote) return;                 // one side never had this year — not a conflict
    if (!local.touched || !remote.touched) return;  // an untouched starter copy is never a real edit
    const loser = winner === local ? remote : local;
    if ((loser.rev || 0) !== (winner.rev || 0)) return; // ranks differ — the loser is simply behind, not a real conflict
    if (JSON.stringify(loser) === JSON.stringify(winner)) return; // identical content — nothing to reconcile
    const clone = JSON.parse(JSON.stringify(loser));
    clone.id = uid();
    clone.session = winner.session + ' — Conflict Copy';
    conflicts.push(clone);
  });

  return { docs, conflicts, report };
}

/* ---------- error classification for the sync status chip ----------
   A request that reached Google and got back a real HTTP response (.status set, either
   by driveApiFetch's Drive API calls or by auth.js's own token-endpoint calls) proves the
   device is online — whatever went wrong is a real API/auth problem, not connectivity, and
   must never be shown to the teacher as "Offline". Only an error with no .status at all
   (fetch failed before any response came back — DNS/network/CORS-level) is a genuine
   connectivity failure. This was the root cause of "Offline" showing right after a
   successful, fully-online sign-in: every non-connectivity error used to be mislabelled
   the same way. */
function classifySyncError(e) {
  if (e && e.needsSignIn) return { status: 'attention', toastMessage: null };
  const reachedServer = typeof (e && e.status) === 'number';
  if (!reachedServer) return { status: 'offline', toastMessage: null };
  return {
    status: 'attention',
    toastMessage: 'Sync could not complete (' + (e && e.message ? e.message : 'unknown Drive error') + '). Your work is still saved on this device.'
  };
}

/* ---------- account-switch wiring (browser only — see the guard at the bottom of this file) ---------- */
function drivesyncOnAuthChange(auth) {
  if (auth.state === 'signed-in' && auth.account) {
    const wasNs = ACTIVE_NS;
    const targetNs = driveNamespaceFor(auth.account);
    if (wasNs === targetNs) return; // already on this account's workspace — nothing to do
    // Read local (pre-sign-in or previous-account) data BEFORE switching namespace.
    ACTIVE_NS = '';
    const migrateLocal = wasNs === '' && offerMigrationIfNeeded(auth.account);
    const toCopy = migrateLocal ? loadIndex().map((r) => loadDocById(r.id)).filter(Boolean) : [];
    ACTIVE_NS = targetNs;
    if (migrateLocal) {
      toCopy.forEach((d) => persist(migrate(d)));
      toast(toCopy.length + ' year(s) added to your Google account.');
    }
    reloadWorkspace();
    drivesyncRun();
  } else if (auth.state === 'signed-out') {
    ACTIVE_NS = '';
    DRIVESYNC.workspace = null;
    reloadWorkspace();
  }
}

/* ---------- automatic sync loop ---------- */
const DRIVESYNC = { status: 'idle', workspace: null, timer: null, busy: false, lastError: null };

function drivesyncPaint() {
  const el = $('#syncStatus'); if (!el) return;
  if (AUTH.state !== 'signed-in') { el.style.display = 'none'; return; }
  const M = {
    idle: ['☁ Synced', 'saved'],
    syncing: ['↻ Syncing…', 'dirty'],
    offline: ['⚠ Offline — saved locally', 'dirty'],
    attention: ['⚠ Sync needs attention', 'dirty']
  };
  const [text, cls] = M[DRIVESYNC.status] || M.idle;
  el.textContent = text; el.className = 'btn ghost sm status ' + cls; el.style.display = '';
}

function drivesyncSchedule() {
  if (AUTH.state !== 'signed-in') return;
  clearTimeout(DRIVESYNC.timer);
  DRIVESYNC.timer = setTimeout(() => drivesyncRun(), 4000);
}

async function drivesyncEnsureWorkspace(token) {
  if (DRIVESYNC.workspace) return DRIVESYNC.workspace;
  DRIVESYNC.workspace = await driveEnsureWorkspace(token);
  return DRIVESYNC.workspace;
}

function drivesyncMetaKey(id) { return 'acr.drivemeta.' + id; }
function drivesyncGetMeta(id) { try { return JSON.parse(lsGet(drivesyncMetaKey(id)) || 'null'); } catch (e) { return null; } }
function drivesyncSetMeta(id, meta) { lsSet(drivesyncMetaKey(id), JSON.stringify(meta)); }

async function drivesyncRun() {
  if (DRIVESYNC.busy || AUTH.state !== 'signed-in') return;
  if (!navigator.onLine) { DRIVESYNC.status = 'offline'; drivesyncPaint(); return; }
  DRIVESYNC.busy = true; DRIVESYNC.status = 'syncing'; drivesyncPaint();
  try {
    const token = await authGetToken();
    const { rootId, backupsId } = await drivesyncEnsureWorkspace(token);
    DRIVESYNC.workspace = { rootId, backupsId };

    const remoteFiles = await driveListYearFiles(token, rootId);
    const localDocs = loadIndex().map((r) => loadDocById(r.id)).filter(Boolean);

    // Only fetch full content for files whose modifiedTime moved since our last known sync for that id.
    const remoteDocs = [];
    for (const f of remoteFiles) {
      const id = f.properties && f.properties.acrDocId; if (!id) continue;
      const meta = drivesyncGetMeta(id);
      if (meta && meta.driveModifiedTime === f.modifiedTime) {
        const local = localDocs.find((d) => d.id === id);
        if (local) { remoteDocs.push(local); continue; } // unchanged remotely — reuse our own copy, no download
      }
      const content = await driveGetFileContent(token, f.id);
      drivesyncSetMeta(id, { driveFileId: f.id, driveModifiedTime: f.modifiedTime });
      remoteDocs.push(migrate(content));
    }

    const { docs: mergedDocs, conflicts } = mergeDocsWithConflicts(localDocs, remoteDocs);

    mergedDocs.concat(conflicts).forEach((d) => {
      const cur = loadDocById(d.id);
      if (!cur || JSON.stringify(cur) !== JSON.stringify(d)) persist(d, { touch: false });
    });
    if (conflicts.length) {
      saveIndex(loadIndex().concat(conflicts.map((d) => ({ id: d.id, session: d.session, name: d.p1.fullName, updatedAt: d.updatedAt }))));
      toast('Two devices edited ' + conflicts.map((c) => c.session.replace(' — Conflict Copy', '')).join(', ') + ' at the same time. Both versions were kept — open each and delete the one you don’t need.', 8000);
    }

    // Upload every local doc whose Drive copy is missing or stale.
    for (const d of mergedDocs) {
      const meta = drivesyncGetMeta(d.id);
      const remote = remoteFiles.find((f) => f.properties && f.properties.acrDocId === d.id);
      const upToDate = remote && meta && meta.driveModifiedTime === remote.modifiedTime && meta.lastSyncedRev === d.rev;
      if (upToDate) continue;
      const fileId = await driveUpsertYearFile(token, rootId, d, remote ? remote.id : null);
      drivesyncSetMeta(d.id, { driveFileId: fileId, driveModifiedTime: new Date().toISOString(), lastSyncedRev: d.rev });
    }

    if (mergedDocs.some((d) => !remoteFiles.find((f) => f.properties && f.properties.acrDocId === d.id)) || conflicts.length) {
      reloadWorkspace();
    }

    DRIVESYNC.status = 'idle'; DRIVESYNC.lastError = null;
  } catch (e) {
    DRIVESYNC.lastError = e;
    const cls = classifySyncError(e);
    DRIVESYNC.status = cls.status;
    if (cls.toastMessage) toast(cls.toastMessage, 7000);
  } finally {
    DRIVESYNC.busy = false; drivesyncPaint();
  }
}

async function drivesyncExportBackup() {
  if (AUTH.state !== 'signed-in') return;
  try {
    const token = await authGetToken();
    const { backupsId } = await drivesyncEnsureWorkspace(token);
    const allDocs = loadIndex().map((r) => loadDocById(r.id)).filter(Boolean);
    await driveWriteBackupSnapshot(token, backupsId, allDocs);
    toast('A backup copy was also saved to Google Drive.');
  } catch (e) { /* Export Backup itself already succeeded locally — this is a bonus, fail quietly */ }
}

/* Real-browser-only wiring. Guarded so this file stays require()-able under Node for
   testing the pure logic above (mergeDocsWithConflicts) without a DOM. */
if (typeof window !== 'undefined' && typeof document !== 'undefined' && typeof onAuthChange === 'function') {
  onAuthChange(drivesyncOnAuthChange);
  window.addEventListener('online', () => drivesyncRun());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') drivesyncRun(); });
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { mergeDocsWithConflicts, classifySyncError };
}

/* ===================== APP ===================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

/* ---------- storage (localStorage, with graceful degradation) ---------- */
const LS_INDEX = 'acr.index.v1';
const LS_DOC = (id) => 'acr.doc.' + id;
const LS_CUR = 'acr.current.v1';
let memStore = {}, storageOK = true;

/* Which signed-in Google account's workspace is active, e.g. 'acct.<sub>.' — '' means the
   plain, unsigned-in workspace, so a teacher who never signs in gets byte-identical storage
   keys to before this feature existed. Only acr.auth.account (the sign-in marker itself)
   deliberately bypasses this — see auth.js — since it's what decides which namespace to use. */
let ACTIVE_NS = '';
function nsKey(k) { return ACTIVE_NS ? ACTIVE_NS + k : k; }
function lsGet(k) {
  try { return localStorage.getItem(nsKey(k)); } catch (e) { storageOK = false; return memStore[nsKey(k)] ?? null; }
}
function lsSet(k, v) {
  try { localStorage.setItem(nsKey(k), v); } catch (e) { storageOK = false; memStore[nsKey(k)] = v; }
}
function lsDel(k) {
  try { localStorage.removeItem(nsKey(k)); } catch (e) { delete memStore[nsKey(k)]; }
}
/* Raw, never-namespaced storage — used only for the sign-in identity marker
   (auth.js's AUTH_MARKER_KEY), which by definition must be readable before any
   account namespace has been chosen. Everything else uses lsGet/lsSet/lsDel above. */
function gRawGet(k) { try { return localStorage.getItem(k); } catch (e) { return memStore[k] ?? null; } }
function gRawSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { memStore[k] = v; } }
function gRawDel(k) { try { localStorage.removeItem(k); } catch (e) { delete memStore[k]; } }
function loadIndex() { try { return JSON.parse(lsGet(LS_INDEX) || '[]'); } catch (e) { return []; } }
function saveIndex(ix) { lsSet(LS_INDEX, JSON.stringify(ix)); }
function loadDocById(id) { try { return JSON.parse(lsGet(LS_DOC(id))); } catch (e) { return null; } }
/* touch:false writes the record without claiming it was edited. Merges compare
   updatedAt, so merely opening the app must never make this copy look newer
   than a real edit made on the other machine. */
function persist(d, opts) {
  if (!opts || opts.touch !== false) { d.updatedAt = nowISO(); d.touched = true; d.rev = (d.rev || 0) + 1; }
  lsSet(LS_DOC(d.id), JSON.stringify(d));
  const ix = loadIndex().filter((r) => r.id !== d.id);
  ix.unshift({ id: d.id, session: d.session, name: d.p1.fullName, updatedAt: d.updatedAt });
  saveIndex(ix); lsSet(LS_CUR, d.id);
  if (typeof syncSchedule === 'function') syncSchedule();
  if (typeof drivesyncSchedule === 'function') drivesyncSchedule();
}

/* ---------- state ---------- */
const S = { doc: null, section: 'profile', timer: null, dirty: false };

function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, p, v) {
  const ks = p.split('.'); let t = o;
  for (let i = 0; i < ks.length - 1; i++) { if (t[ks[i]] == null) t[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; t = t[ks[i]]; }
  t[ks[ks.length - 1]] = v;
}

function markDirty() {
  S.dirty = true;
  const el = $('#saveStatus'); el.textContent = 'Saving…'; el.className = 'status dirty';
  clearTimeout(S.timer);

}
function saveNow() {

/* repeatable table editor */
function rep(path, cols, opt) {
  opt = opt || {};

    '<th style="width:38px"></th></tr></thead><tbody>';
  if (!rows.length) {
    h += '<tr><td colspan="' + (cols.length + 2) + '" class="emptyrow">' + esc(opt.empty || 'No entries yet.') + '</td></tr>';
  }

/* ---------- live score bars ---------- */
function bar(id, items) {
  const el = document.getElementById(id); if (!el) return;
  el.innerHTML = items.map((i) => '<div class="s ' + (i.cls || '') + '"><b>' + i.v + '</b><span>' + esc(i.k) + '</span></div>').join('');
}
function refreshLiveScores() {
  const t = totals(S.doc);
  bar('c1bar', [
    { k: '(a) classes', v: fmt(t.c1.a) }, { k: '(b) excess load', v: fmt(t.c1.b) },
    { k: '(ii) resources', v: fmt(t.c1.ii) }, { k: '(iii) innovation', v: fmt(t.c1.iii) },
    { k: '(iv) examination', v: fmt(t.c1.iv) },
    { k: 'Category I / 125', v: fmt(t.c1.total), cls: t.c1.total >= 75 ? 'okv' : 'warnv' }
  ]);
  bar('c2bar', [
    { k: '(i) extension', v: fmt(t.c2.i) }, { k: '(ii) corporate life', v: fmt(t.c2.ii) },
    { k: '(iii) professional', v: fmt(t.c2.iii) },
    { k: 'Category II / 25', v: fmt(t.c2.total), cls: t.c2.total >= 15 ? 'okv' : 'warnv' }
  ]);
  bar('c3bar', [
    { k: 'papers + books', v: fmt(t.c3.blocks.A + t.c3.blocks.Bi + t.c3.blocks.Bii + t.c3.blocks.Biii) },
    { k: 'projects', v: fmt(t.c3.blocks.Ci + t.c3.blocks.Cii + t.c3.blocks.Ciii + t.c3.blocks.Civ) },
    { k: 'guidance', v: fmt(t.c3.blocks.D) },
    { k: 'training (cap 30)', v: fmt(t.c3.training) },
    { k: 'conferences + lectures', v: fmt(t.c3.blocks.Eii + t.c3.blocks.Eiii) },
    { k: 'Category III', v: fmt(t.c3.total), cls: 'okv' }
  ]);
  bar('sumbar', [
    { k: 'Category I', v: fmt(t.c1.final), cls: t.c1.final >= 75 ? 'okv' : 'warnv' },
    { k: 'Category II', v: fmt(t.c2.final), cls: t.c2.final >= 15 ? 'okv' : 'warnv' },
    { k: 'I + II (min 100)', v: fmt(t.c1.final + t.c2.final), cls: t.c1.final + t.c2.final >= 100 ? 'okv' : 'warnv' },
    { k: 'Category III', v: fmt(t.c3.final) }
  ]);
  $$('[data-cap]').forEach((el) => { el.innerHTML = capHTML(el.dataset.cap); });
  $$('[data-sug]').forEach((el) => {
    const k = el.dataset.sug, rows = S.doc.s2.c3[k] || [];
    el.textContent = rows.length
      ? 'Rule suggests: ' + rows.map((r) => fmt(suggested(k, r, S.doc.stream))).join(' · ')
      : '';
  });

    '% → the rule gives ' + fmt(t.c1.autoA) + '. Leave the box blank to use that figure.';
  const sn = $('#storageNote');
  if (sn) sn.textContent = storageOK
    ? 'Storage: this browser’s local storage. Working normally.'
    : 'Warning — this browser is blocking local storage (private mode?). Your work is only held in memory. Export a backup before closing the tab.';
}

function renderNav() {
  $('#nav').innerHTML = '<div class="navhead">Your part of the ACR</div>' +
    SECTIONS.slice(0, 9).map(([k, t]) => '<a data-sec="' + k + '" class="' + (S.section === k ? 'active' : '') + '">' + esc(t) + '</a>').join('') +
    '<hr>' + SECTIONS.slice(9).map(([k, t]) => '<a data-sec="' + k + '" class="' + (S.section === k ? 'active' : '') + '">' + esc(t) + '</a>').join('');
  $('#mobsel').innerHTML = SECTIONS.map(([k, t]) => '<option value="' + k + '"' + (S.section === k ? ' selected' : '') + '>' + esc(t) + '</option>').join('');
}
/* Previous / Next along the order of the form, so the whole ACR can be
   worked through without going back to the section list each time. */
function stepNav() {
  const i = SECTIONS.findIndex(([k]) => k === S.section);
  const prev = i > 0 ? SECTIONS[i - 1] : null;
  const next = i > -1 && i < SECTIONS.length - 1 ? SECTIONS[i + 1] : null;
  const btn = (s, dir) => s
    ? '<button class="btn stepbtn" data-sec="' + s[0] + '">' +
      (dir === 'prev' ? '<span class="ar">←</span>' : '') +
      '<span class="lbl"><small>' + (dir === 'prev' ? 'Previous' : 'Next') + '</small>' + esc(s[1]) + '</span>' +
      (dir === 'next' ? '<span class="ar">→</span>' : '') + '</button>'
    : '<span></span>';
  return '<nav class="stepnav">' + btn(prev, 'prev') +
    '<span class="stepcount">' + (i + 1) + ' of ' + SECTIONS.length + '</span>' +
    btn(next, 'next') + '</nav>';
}

function render() {
  renderNav();
  $('#main').innerHTML = PAGES[S.section]() + stepNav();
  refreshLiveScores();
  renderSessionSelect();
  if (typeof syncPaint === 'function') syncPaint();
  if (typeof authPaint === 'function') authPaint();
  if (typeof drivesyncPaint === 'function') drivesyncPaint();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

  if (!authAvailable()) { el.textContent = 'Sign-in not configured'; el.style.display = ''; el.dataset.authAction = ''; return; }

  } else if (AUTH.state === 'signing-in') {

    el.dataset.authAction = '';
  } else {
    el.textContent = 'Sign in with Google';
    el.dataset.authAction = 'signIn';
  }
}

function step(delta) {
  const i = SECTIONS.findIndex(([k]) => k === S.section) + delta;
  if (i < 0 || i >= SECTIONS.length) return;
  S.section = SECTIONS[i][0]; render();
}

function fileBase() {
  const n = (S.doc.p1.fullName || 'ACR').replace(/[^\w]+/g, '_');

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 4000);
}
function downloadDocx() {
  saveNow();
  try {
    const blob = buildDocx(buildDoc(S.doc), docMeta());
    saveBlob(blob, fileBase() + '.docx');
    toast('Word file downloaded.');
  } catch (e) { toast('Could not build the Word file: ' + e.message, 5000); }
}

/* ---------- backup ---------- */
function exportAll() {
  const ix = loadIndex();
  const docs = ix.map((r) => loadDocById(r.id)).filter(Boolean);
  const pack = { kind: 'acr-backup', version: 1, exportedAt: nowISO(), docs };
  saveBlob(new Blob([JSON.stringify(pack, null, 2)], { type: 'application/json' }),
    'ACR_backup_' + new Date().toISOString().slice(0, 10) + '.acrbak.json');
  toast(docs.length + ' year(s) exported.');
}
function exportOne() {
  const pack = { kind: 'acr-backup', version: 1, exportedAt: nowISO(), docs: [S.doc] };
  saveBlob(new Blob([JSON.stringify(pack, null, 2)], { type: 'application/json' }), fileBase() + '.acrbak.json');
}
async function importFile(file) {
  if (!file) return;
  try {
    const raw = JSON.parse(await file.text());
    const docs = raw.kind === 'acr-backup' ? raw.docs : (raw.schemaVersion ? [raw] : null);
    if (!docs) throw new Error('Not an ACR backup file.');
    let n = 0;
    docs.forEach((d) => { if (d && d.id) { persist(migrate(d)); n++; } });
    toast(n + ' year(s) imported.');
    render();
  } catch (e) { toast('Import failed: ' + e.message, 5000); }
}

/* ---------- schema migration ---------- */
function migrate(d) {
  const base = blankDoc(d.session);
  const merge = (a, b) => {
    Object.keys(a).forEach((k) => {
      if (b[k] === undefined || b[k] === null) return;
      if (Array.isArray(a[k])) a[k] = Array.isArray(b[k]) ? b[k] : a[k];
      else if (typeof a[k] === 'object') merge(a[k], b[k]);
      else a[k] = b[k];
    });
    return a;
  };
  const out = merge(base, d);
  out.id = d.id || uid();
  out.schemaVersion = SCHEMA_VERSION;
  /* records written before the flag existed hold real work — never treat them
     as a pristine starter year that a merge may discard */
  out.touched = d.touched === undefined ? true : !!d.touched;
  return out;
}

/* ---------- events ---------- */
function bindGlobal() {
  document.addEventListener('input', (e) => {
    const p = e.target.dataset && e.target.dataset.path;
    if (!p) return;
    setPath(S.doc, p, e.target.value);
    markDirty();
  });
  document.addEventListener('change', (e) => {
    const p = e.target.dataset && e.target.dataset.path;
    if (p && e.target.dataset.rerender) { setPath(S.doc, p, e.target.value); saveNowForced(); render(); return; }
    if (p) { setPath(S.doc, p, e.target.value); markDirty(); }
    if (e.target.id === 'impFile') importFile(e.target.files[0]);
    if (e.target.id === 'mobsel') { S.section = e.target.value; render(); }
    if (e.target.id === 'sessionSel') openDoc(e.target.value);
  });

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, a[data-sec]');
    if (!b) return;
    const ds = b.dataset;

    if (ds.sec) { S.section = ds.sec; render(); return; }
    if (ds.color) { S.doc.style.answerColor = ds.color; saveNowForced(); render(); return; }
    if (ds.add) {
      const arr = getPath(S.doc, ds.add) || [];
      arr.push(JSON.parse(ds.tpl || '{}'));
      setPath(S.doc, ds.add, arr); saveNow(); render(); return;
    }
    if (ds.del) {
      const arr = getPath(S.doc, ds.del) || [];
      arr.splice(+ds.i, 1); saveNow(); render(); return;
    }
    if (ds.apply) {
      const rows = S.doc.s2.c3[ds.apply] || [];
      rows.forEach((r) => { r.score = fmt(suggested(ds.apply, r, S.doc.stream)); });
      saveNow(); render(); toast('Suggested scores applied to ' + rows.length + ' row(s).'); return;
    }
    if (ds.open) { openDoc(ds.open); return; }
    if (ds.clone) {
      const src = loadDocById(ds.clone); if (!src) return;
      const next = prompt('Session for the new ACR (e.g. 2025-26):', nextSession(src.session));
      if (next === null) return;
      const nd = cloneForNewYear(migrate(src), next.trim());
      persist(nd); S.doc = nd; S.section = 'profile'; render();
      toast('New year created. Identity and college details carried over.'); return;
    }
    if (ds.drop) {
      if (!confirm('Delete this year permanently from this device? Export a backup first if unsure.')) return;
      lsDel(LS_DOC(ds.drop));
      saveIndex(loadIndex().filter((r) => r.id !== ds.drop));
      if (S.doc.id === ds.drop) { const ix = loadIndex(); S.doc = ix.length ? migrate(loadDocById(ix[0].id)) : blankDoc(''); persist(S.doc); }
      render(); toast('Deleted.'); return;
    }

    switch (b.id) {
      case 'btnPreview': case 'btnPreview2': openPreview(); break;
      case 'btnClosePv': closePreview(); break;
      case 'btnDocx': case 'btnDocx2': downloadDocx(); break;
      case 'btnPdf': case 'btnPdf2': doPrint(); break;
      case 'btnSave': saveNow(); toast('Saved on this device.'); break;
      case 'authArea': case 'authArea2':
        if (b.dataset.authAction === 'signIn') authSignIn().catch((e) => toast(e.message, 5000));
        else if (b.dataset.authAction === 'signOut') authSignOut();
        break;
      case 'syncNowDrive': if (typeof drivesyncRun === 'function') drivesyncRun(); break;
      case 'expAll': exportAll(); if (typeof drivesyncExportBackup === 'function') drivesyncExportBackup(); break;
      case 'expOne': exportOne(); break;
      case 'impBtn': $('#impFile').click(); break;
      case 'syncNew': syncLink('save'); break;
      case 'syncOpen': syncLink('open'); break;
      case 'syncNow': (async () => {
        if (!SYNC.handle) { toast('Link a sync file first.'); return; }
        if ((await syncPermission(true)) !== 'granted') { toast('Permission was not granted.'); return; }
        SYNC.state = 'linked'; await syncRun(true);
      })(); break;
      case 'syncOff': syncUnlink(); break;
      case 'syncStatus':
        if (SYNC.state === 'needs-permission' || SYNC.state === 'error') {
          (async () => {
            if ((await syncPermission(true)) === 'granted') { SYNC.state = 'linked'; await syncRun(true); }
          })();
        }
        break;
      case 'newBlank': {
        const s = prompt('Session for the new blank ACR (e.g. 2025-26):', ''); if (s === null) return;
        const nd = blankDoc(s.trim()); persist(nd); S.doc = nd; S.section = 'profile'; render(); break;
      }
      case 'newFromCurrent': {
        const s = prompt('Session for the new ACR:', nextSession(S.doc.session)); if (s === null) return;
        const nd = cloneForNewYear(S.doc, s.trim()); persist(nd); S.doc = nd; S.section = 'profile'; render();
        toast('New year created.'); break;
      }
    }
  });

  window.addEventListener('beforeunload', () => { if (S.dirty) saveNow(); });
  /* last chance to push before the tab is backgrounded or closed */
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      if (S.dirty) saveNow();
      if (typeof SYNC !== 'undefined' && SYNC.handle && SYNC.state === 'linked') { clearTimeout(SYNC.timer); syncRun(false); }
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePreview();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveNow(); toast('Saved.'); }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''));
    if (e.altKey && !typing && e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    if (e.altKey && !typing && e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  });
}

function nextSession(s) {
  const m = String(s || '').match(/^(\d{4})\s*[-–/]\s*(\d{2,4})$/);
  if (!m) return '';
  const a = +m[1] + 1, b = String(+m[2] + 1).padStart(m[2].length, '0');
  return a + '-' + b;
}
function openDoc(id) {
  const d = loadDocById(id); if (!d) return;
  S.doc = migrate(d); lsSet(LS_CUR, id); S.section = 'profile'; render();
}

/* ---------- workspace loading (shared by boot and account switching) ---------- */
function loadActiveDoc() {
  const ix = loadIndex();
  const curId = lsGet(LS_CUR);
  let d = null;
  if (curId) d = loadDocById(curId);
  if (!d && ix.length) d = loadDocById(ix[0].id);
  if (!d) d = blankDoc('');
  return migrate(d);
}
/* Called whenever the active account namespace changes (sign-in, sign-out, switch account)
   so the screen reflects that account's own years rather than the previous namespace's. */
function reloadWorkspace() {
  S.doc = loadActiveDoc();
  persist(S.doc, { touch: false });
  S.section = 'profile';
  render();
}

/* ---------- boot ---------- */
(function boot() {
  S.doc = loadActiveDoc();
  persist(S.doc, { touch: false });
  bindGlobal();
  if (typeof authBoot === 'function') authBoot();
  render();
  if (!storageOK) toast('This browser is blocking local storage. Export a backup before you close the tab.', 6000);
  syncBoot();
})();

</script>
</body>
